<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Klassenbuch – Verfügbarkeit</title>
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f5f5f2;--card:#fff;--soft:#ecece6;--tx:#1e1f1c;--tx2:#5c5e57;--bd:#deded6;--bd2:#c9cac0;--ac:#1d5a8f;--ok:#3b6d11;--okbg:#d9ecc4;--wa:#7d4a0a;--wabg:#f8e2b8;--da:#a32d2d;--off:#e4e4dd}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1d;--soft:#2a2a28;--tx:#f1f1ec;--tx2:#b4b4ac;--bd:#33332f;--bd2:#46463f;--ac:#8dbbe8;--ok:#b5dc7f;--okbg:#2f4f1f;--wa:#f2c27a;--wabg:#5c3d13;--da:#f09a9a;--off:#232321;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Aptos,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:720px;margin:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-size:13px;color:var(--tx2);margin:0 0 14px}
h1{font-size:24px;line-height:1.2;margin:0 0 6px;text-wrap:balance}
p{margin:6px 0}.s{font-size:14px;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 0 12px}.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;border:1px solid var(--bd2)}
.c2{background:var(--okbg);color:var(--ok);border-color:transparent}.c1{background:var(--wabg);color:var(--wa);border-color:transparent}
.gridw{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
th{font-size:13px;font-weight:600;padding:0}
th.t,td.t{width:48px;font-size:12px;color:var(--tx2);font-weight:400;text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
th button{width:100%;font:inherit;font-weight:600;color:var(--tx);background:none;border:0;padding:6px 0;cursor:pointer;border-radius:6px}
td{padding:0}
.cell{display:grid;place-items:center;width:100%;height:38px;border-radius:6px;border:1px solid var(--bd2);background:var(--card);font-size:15px;font-weight:700;color:inherit;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
.cell.c2{background:var(--okbg);color:var(--ok);border-color:transparent}.cell.c1{background:var(--wabg);color:var(--wa);border-color:transparent}
.no{height:38px;border-radius:6px;background:var(--off)}
.fine table{border-spacing:3px 1px}.fine .cell,.fine .no{height:24px;font-size:12px;border-radius:4px}.cell.anc{outline:2px solid var(--ac);outline-offset:1px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:14px;color:var(--tx2);margin:0 0 4px}
textarea{font:inherit;width:100%;min-height:70px;border:1px solid var(--bd2);border-radius:8px;padding:8px;background:var(--card);color:var(--tx);resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--tx);margin:12px 0 0}.chk input{margin-top:4px;flex:none}
.save{font:inherit;font-weight:600;background:var(--ac);color:var(--card);border:0;border-radius:8px;padding:11px 20px;cursor:pointer;min-height:44px}
.save:disabled{opacity:.6}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
#msg{font-size:14px;min-width:0}#msg.err{color:var(--da)}#msg.ok{color:var(--ok)}
.res{font-size:22px;font-weight:600;margin:6px 0}
a{color:var(--ac)}
.top{display:flex;align-items:center;gap:10px;margin:0 0 14px}.top .brand{margin:0;flex:1;min-width:0}
.lng{font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:.05em;color:var(--tx2);background:none;border:1px solid var(--bd2);border-radius:8px;padding:7px 10px;cursor:pointer;min-height:32px}
</style></head><body><main class="wrap" id="p"><p class="s">…</p></main>
<script>
const API = "https://www.adrianpopp.ch/_functions/kb/";
// Sprache: Wahl der Familie (kb-lang), sonst Browser. Texte der Lehrperson bleiben, wie sie sind.
let EN = (() => { try { const s = localStorage.getItem("kb-lang"); if (s) return s === "en"; } catch(e) {} return !(navigator.languages || [navigator.language || ""]).some(l => /^de/i.test(l)); })();
const L = (de, en) => EN ? en : de;
const dayL = () => EN ? ["", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"] : ["", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
const shortL = () => EN ? ["", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : ["", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
let again = null;
function head(extra){ return `<div class="top"><p class="brand">Klassenbuch${extra || ""}</p><button class="lng" type="button" id="lng" lang="${EN ? "de" : "en"}">${EN ? "Deutsch" : "English"}</button></div>`; }
function applyLang(){ document.documentElement.lang = EN ? "en" : "de-CH"; document.title = "Klassenbuch – " + L("Verfügbarkeit", "Availability"); }
applyLang();
const p = document.getElementById("p"), te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fromUrl = s => { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/")), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const toB64 = u => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unB64 = s => fromUrl(s.replace(/\+/g, "-").replace(/\//g, "_"));
const M = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
const T = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const dat = s => { const [y, m, d] = String(s).split("-").map(Number); return !(d && m) ? "" : EN ? new Date(y, m - 1, d).toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"}) : `${d}.${m}.${y}`; };
function stop(de, en){ again = () => stop(de, en); p.innerHTML = `${head()}<h1>${esc(L(de[0], en[0]))}</h1><p>${esc(L(de[1], en[1]))}</p>`; }
async function post(action, body){
  const r = await fetch(API + action, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok){ const e = new Error(j.error || "http"); e.status = r.status; throw e; }
  return j;
}
let key, token, f, c = {}, paint = null, skip = false, anchor = null;
const enc = async o => { const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, te.encode(JSON.stringify(o)))), u = new Uint8Array(12 + ct.length); u.set(iv); u.set(ct, 12); return toB64(u); };
const dec = async s => { const u = unB64(s); return JSON.parse(td.decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: u.subarray(0, 12)}, key, u.subarray(12)))); };
const inWin = (tag, m) => f.fenster.some(w => w.tag === tag && m + f.raster > M(w.von) && m < M(w.bis));
const k = (tag, m) => tag + "-" + T(m);
const sym = v => v === 2 ? "✓" : v === 1 ? "~" : "";
const label = v => v === 2 ? L("passt gut", "suits well") : v === 1 ? L("geht notfalls", "if need be") : L("geht nicht", "not possible");
function setCell(b, v){ const id = b.dataset.k; if (v) c[id] = v; else delete c[id]; b.className = "cell" + (v ? " c" + v : ""); b.textContent = sym(v); b.setAttribute("aria-label", `${b.dataset.n}: ${label(v)}`); }
const next = v => v === 0 || v === undefined ? 2 : v === 2 ? 1 : 0;
function view(ans){
  again = () => { const n = document.getElementById("note"), u = document.getElementById("unk"); view({c, n: n ? n.value : "", u: u ? u.checked : false}); };
  anchor = null; const DAYS = dayL(), SHORT = shortL();
  c = ans && ans.c ? {...ans.c} : {};
  const tags = [...new Set(f.fenster.map(w => w.tag))].sort((a, b) => a - b), r = f.raster;
  const lo = Math.min(...f.fenster.map(w => Math.floor(M(w.von) / r) * r)), hi = Math.max(...f.fenster.map(w => M(w.bis)));
  let rows = "";
  for (let m = lo; m < hi; m += r){
    if (!tags.some(t => inWin(t, m))) continue;
    rows += `<tr><td class="t">${r >= 15 || m % (r === 10 ? 30 : 15) === 0 ? T(m) : ""}</td>${tags.map(t => inWin(t, m) ? `<td><button type="button" class="cell" data-k="${k(t, m)}" data-t="${t}" data-n="${DAYS[t]} ${T(m)}"></button></td>` : `<td><div class="no"></div></td>`).join("")}</tr>`;
  }
  p.innerHTML = `${head(f.lp ? " · " + esc(f.lp) : "")}
    <h1>${L(`Wann hat ${esc(f.name)} Zeit?`, `When is ${esc(f.name)} available?`)}</h1>
    <p>${esc(f.titel)} · ${L(`${f.dauer} Minuten pro Woche. Bitte bis ${dat(f.frist)} eintragen.`, `${f.dauer} minutes per week. Please fill in by ${dat(f.frist)}.`)}</p>
    ${f.hinweis ? `<p class="s">${esc(f.hinweis)}</p>` : ""}
    <div class="card">
      <div class="leg"><span><i class="dot c2">✓</i>${label(2)}</span><span><i class="dot c1">~</i>${label(1)}</span><span><i class="dot"></i>${label(0)}</span></div>
      <p class="s" style="margin:0 0 10px">${r < 15 ? L("Tippe zuerst auf den Beginn und dann auf das Ende einer Zeit. Tippst du nochmals, ändert sich die Farbe.", "Tap the start and then the end of a time span. Tap again to change the colour.") : L("Tippe auf ein Feld, um es zu ändern.", "Tap a box to change it.")} ${L("Je mehr Zeiten du angibst, desto eher klappt es.", "The more times you mark, the easier it is to find a slot.")}</p>
      <div class="gridw${r < 15 ? " fine" : ""}"><table><thead><tr><th class="t"></th>${tags.map(t => `<th><button type="button" data-day="${t}" aria-label="${L(`Ganzen ${DAYS[t]} ändern`, `Change all of ${DAYS[t]}`)}">${SHORT[t]}</button></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    </div>
    <div class="card">
      <label for="note">${L("Bemerkung (freiwillig)", "Comment (optional)")}</label>
      <textarea id="note" maxlength="500" placeholder="${L("Zum Beispiel: Mittwoch erst ab 14:15 wegen Schulweg", "For example: Wednesday only from 14:15 because of the way home from school")}">${esc(ans && ans.n || "")}</textarea>
      <label class="chk"><input type="checkbox" id="unk" ${ans && ans.u ? "checked" : ""}><span>${L("Der Schulstundenplan steht noch nicht fest. Ich trage die Zeiten über denselben Link nach.", "The school timetable isn’t fixed yet. I’ll add the times later using the same link.")}</span></label>
    </div>
    <div class="act"><button class="save" id="save" type="button">${L("Speichern", "Save")}</button><span id="msg" role="status"></span></div>
    <p class="s" style="margin-top:24px">${L(`Deine Angaben werden auf diesem Gerät verschlüsselt und sind nur für ${f.lp ? esc(f.lp) : "deine Lehrperson"} lesbar. Andere Familien sehen sie nicht. Nach der Planung werden sie gelöscht.`, `Your entries are encrypted on this device and can only be read by ${f.lp ? esc(f.lp) : "your teacher"}. Other families can’t see them. They are deleted after planning.`)} <a href="rechtliches.html" target="_blank" rel="noopener">${L("Datenschutz", "Privacy (German)")}</a></p>`;
  p.querySelectorAll(".cell").forEach(b => setCell(b, c[b.dataset.k] || 0));
}
p.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button) return;
  const b = e.target.closest(".cell"); if (!b) return;
  paint = next(c[b.dataset.k] || 0); skip = true; setCell(b, paint); e.preventDefault();
});
p.addEventListener("pointerover", e => { if (paint === null) return; const b = e.target.closest(".cell"); if (b) setCell(b, paint); });
addEventListener("pointerup", () => { paint = null; });
p.addEventListener("click", e => {
  const d = e.target.closest("[data-day]");
  if (e.target.closest("#lng")){ EN = !EN; try { localStorage.setItem("kb-lang", EN ? "en" : "de"); } catch(x) {} applyLang(); if (again) again(); return; }
  if (d){ const l = [...p.querySelectorAll(`.cell[data-t="${d.dataset.day}"]`)], v = next(c[l[0].dataset.k] || 0); l.forEach(b => setCell(b, v)); return; }
  if (e.target.closest("#save")){ save(); return; }
  const b = e.target.closest(".cell"); if (!b) return;
  if (skip){ skip = false; return; }
  if (f.raster >= 15) return setCell(b, next(c[b.dataset.k] || 0));
  if (!anchor || anchor.dataset.t !== b.dataset.t){ if (anchor) anchor.classList.remove("anc"); anchor = b; b.classList.add("anc"); return; }
  const col = [...p.querySelectorAll(`.cell[data-t="${b.dataset.t}"]`)], i = col.indexOf(anchor), j = col.indexOf(b), v = next(c[anchor.dataset.k] || 0);
  col.slice(Math.min(i, j), Math.max(i, j) + 1).forEach(x => setCell(x, v)); anchor = null;
});
function fits(){
  const r = f.raster, n = Math.ceil(f.dauer / r);
  return Object.keys(c).some(id => { const [t, h] = id.split("-"); for (let i = 0; i < n; i++) if (!c[t + "-" + T(M(h) + i * r)]) return false; return true; });
}
async function save(){
  const msg = document.getElementById("msg"), btn = document.getElementById("save"), u = document.getElementById("unk").checked;
  msg.className = "";
  if (!u && !Object.keys(c).length){ msg.className = "err"; msg.textContent = L("Bitte markiere mindestens eine Zeit.", "Please mark at least one time."); return; }
  if (!u && !fits()){ msg.className = "err"; msg.textContent = L(`Bitte markiere mindestens einmal ${f.dauer} Minuten am Stück.`, `Please mark at least one block of ${f.dauer} minutes in a row.`); return; }
  btn.disabled = true; msg.textContent = L("Wird gespeichert …", "Saving …");
  try {
    await post("fput", {t: token, ans: await enc({v: 1, c, n: document.getElementById("note").value.trim().slice(0, 500), u, at: Date.now()})});
    msg.className = "ok"; msg.textContent = L(`Gespeichert. Du kannst die Zeiten über diesen Link bis ${dat(f.frist)} ändern.`, `Saved. You can change your times using this link until ${dat(f.frist)}.`);
  } catch(e) {
    msg.className = "err"; msg.textContent = e.status === 410 ? L("Die Eintragung ist bereits abgeschlossen.", "This form is already closed.") : L("Das hat nicht geklappt. Prüfe die Verbindung und versuche es nochmals.", "That didn’t work. Check your connection and try again.");
  }
  btn.disabled = false;
}
addEventListener("hashchange", () => location.reload());
function result(){
  again = result; const r = f.res, von = M(r.zeit), DAYS = dayL();
  p.innerHTML = `${head(f.lp ? " · " + esc(f.lp) : "")}<h1>${L("Stundenplan für", "Timetable for")} ${esc(f.name)}</h1><p>${esc(f.titel)}</p>
    <div class="card"><p class="s">${L("Die Lektion findet neu hier statt:", "The lesson will take place:")}</p><p class="res">${DAYS[r.tag]}, ${T(von)}–${T(von + f.dauer)}</p>${r.ort ? `<p>${esc(r.ort)}</p>` : ""}</div>`;
}
(async () => {
  const raw = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{22}$/.test(raw)) return stop(["Dieser Link ist unvollständig", "Bitte öffne den ganzen Link aus der Nachricht deiner Lehrperson."], ["This link is incomplete", "Please open the full link from your teacher’s message."]);
  try {
    key = await crypto.subtle.importKey("raw", fromUrl(raw), "AES-GCM", false, ["encrypt", "decrypt"]);
    token = [...new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode("klassenbuch-form-v1:" + raw)))].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 32);
    const r = await post("fget", {t: token});
    f = await dec(r.form);
    if (f.res) return result();
    view(r.ans ? await dec(r.ans) : null);
  } catch(e) {
    if (e.status === 404) return stop(["Dieser Link gilt nicht mehr", "Bitte frage bei deiner Lehrperson nach."], ["This link is no longer valid", "Please ask your teacher."]);
    if (e.status === 410) return stop(["Die Eintragung ist abgeschlossen", "Falls sich noch etwas geändert hat, melde dich bitte bei deiner Lehrperson."], ["This form is closed", "If anything has changed, please contact your teacher."]);
    stop(["Das hat nicht geklappt", "Prüfe die Verbindung und lade die Seite neu."], ["That didn’t work", "Check your connection and reload the page."]);
  }
})();
</script></body></html>
