/* Geburtstage aller aktiven SuS (Einzel und Gruppenmitglieder) zwischen zwei Daten (ISO) */
function bdays(from, to){
  const out = [], add = (name, g, sid) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g || "")) return;
    const [by, bm, bd] = g.split("-").map(Number);
    for (let y = +from.slice(0, 4); y <= +to.slice(0, 4); y++){
      const day = bm === 2 && bd === 29 && new Date(y, 1, 29).getMonth() !== 1 ? 28 : bd, ds = iso(new Date(y, bm - 1, day));
      if (ds >= from && ds <= to && y > by) out.push({datum: ds, name, alter: y - by, sid});
    }
  };
  for (const s of db.students){
    if (s.aktiv === false) continue;
    if (s.typ === "Gruppe") gMembers(s).forEach(x => add(x.name, x.geburt, s.id)); else add(s.name, (s.stammblatt || {}).geburt, s.id);
  }
  return out.sort((a, b) => a.datum.localeCompare(b.datum) || a.name.localeCompare(b.name));
}

function kw(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7); const w1 = new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7); }

function tx(store, mode2, fn){
  return new Promise((ok, no) => { const t = idb.transaction(store, mode2), s = t.objectStore(store); let res; Promise.resolve(fn(s)).then(v => res = v); t.oncomplete = () => ok(res); t.onerror = t.onabort = () => no(t.error); });
}
const idbGet = (store, k) => new Promise((ok, no) => { const r = idb.transaction(store).objectStore(store).get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idbAll = store => new Promise((ok, no) => { const out = {}, r = idb.transaction(store).objectStore(store).openCursor(); r.onsuccess = () => { const c = r.result; if (c){ out[c.key] = c.value; c.continue(); } else ok(out); }; r.onerror = () => no(r.error); });
const idbPut = (store, k, v) => tx(store, "readwrite", s => { s.put(v, k); });
const idbDel = (store, k) => tx(store, "readwrite", s => { s.delete(k); });

function unb64(s){ const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
// Passwort → Anmeldewert (auth) + Schlüssel zum Öffnen der Schlüsselhülle (kek).
// Die Daten selbst sind mit einem zufälligen Datenschlüssel (dek) verschlüsselt, der in zwei Hüllen
// auf dem Server liegt: eine für das Passwort, eine für den Wiederherstellungsschlüssel.
async function kdf(secret, saltText, iterations){
  const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt: te.encode(saltText), iterations}, base, 512));
}
async function derive(email, pw){
  email = email.trim().toLowerCase();
  const bits = await kdf(pw, "klassenbuch-v1:" + email, 600000);
  return {email, acct: hex(await crypto.subtle.digest("SHA-256", te.encode("klassenbuch-v1:" + email))).slice(0, 40), auth: hex(bits.slice(0, 32)), kek: bits.slice(32)};
}
async function deriveRk(email, rk){
  const bits = await kdf(rk, "klassenbuch-rk-v1:" + email.trim().toLowerCase(), 100000);
  return {rauth: hex(bits.slice(0, 32)), kek: bits.slice(32)};
}
async function wrapKey(dek, kek){ const k = await crypto.subtle.importKey("raw", kek, "AES-GCM", false, ["encrypt"]); const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, dek)); const o = new Uint8Array(12 + c.length); o.set(iv); o.set(c, 12); return b64(o); }
async function unwrapKey(w, kek){ const k = await crypto.subtle.importKey("raw", kek, "AES-GCM", false, ["decrypt"]); const u = unb64(w); return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv: u.subarray(0, 12)}, k, u.subarray(12))); }
const RKA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function genRk(){ const b = crypto.getRandomValues(new Uint8Array(32)); const s = [...b].map(x => RKA[x & 31]).join(""); return "KB-" + s.match(/.{4}/g).join("-"); }
function normRk(s){ s = String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (s.length === 34 && s.startsWith("KB")) s = s.slice(2); return s.length === 32 ? s : null; }
async function useAcc(a){ acc = {...a, key: await crypto.subtle.importKey("raw", unb64(a.raw), "AES-GCM", false, ["encrypt","decrypt"])}; }
async function encBytes(u8){ const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, acc.key, u8)); const o = new Uint8Array(12 + c.length); o.set(iv); o.set(c, 12); return o; }
async function decBytes(u8){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv: u8.subarray(0, 12)}, acc.key, u8.subarray(12))); }
const encObj = async o => b64(await encBytes(te.encode(JSON.stringify(o))));
const decObj = async s => JSON.parse(td.decode(await decBytes(unb64(s))));

/* --- Server --- */
async function api(action, body){
  const r = await fetch(SYNC + action, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, acct: acc?.acct, auth: acc?.auth, ...(body.acct ? {acct: body.acct, auth: body.auth} : {})})});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok){ const e = new Error(j.error || ("http " + r.status)); e.code = j.error || r.status; throw e; }
  return j;
}

/* --- Lokale Datensätze: meta, books, lesson:<id>, pdf:<id> --- */
function recOf(key){
  if (key === "meta") return {students: db.students, events: db.events, lastBackup: db.lastBackup, schulen: db.schulen || null, notiz: db.notiz || "", pdfSync: typeof db.pdfSync === "boolean" ? db.pdfSync : null};
  if (key === "books") return {books};
  if (key.startsWith("lesson:")) return db.lessons.find(l => l.id === key.slice(7)) || null;
  if (key.startsWith("ink:")){ const v = ink[key.slice(4)]; return v && Object.keys(v.p || {}).length ? v : null; }
  return undefined;
}
async function flush(){
  if (mode !== "app" || flushing){ if (flushing) schedule(); return; }
  flushing = true;
  try {
    const keys = [];
    if (metaDirty){ metaDirty = false; keys.push("meta"); }
    if (booksDirty){ booksDirty = false; keys.push("books"); }
    for (const id of [...dirtyL]){ dirtyL.delete(id); keys.push("lesson:" + id); }
    for (const id of [...delL]){ delL.delete(id); keys.push("lesson:" + id); }
    for (const k of [...dirtyInk]){ dirtyInk.delete(k); keys.push("ink:" + k); }
    if (keys.length){
      await tx("rec", "readwrite", s => keys.forEach(k => { const v = recOf(k); if (v) s.put({v: structuredClone(v), rev: 0}, k); else s.delete(k); }));
      if (acc){ keys.forEach(k => cfg.outbox.includes(k) || cfg.outbox.push(k)); await saveCfg(); syncSoon(1500); }
      setSync(acc ? "Gespeichert, wird synchronisiert …" : "Auf diesem Gerät gespeichert");
    }
  } catch(e) { toast("Speichern auf dem Gerät ist fehlgeschlagen."); setSync("Nicht gespeichert"); }
  flushing = false;
  if (metaDirty || booksDirty || dirtyL.size || delL.size || dirtyInk.size) schedule();
}
function busyTyping(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function remoteRender(){ if (!(loaded.meta && loaded.lessons)) return; if (!document.getElementById("pv").hidden) return; if (busyTyping()) pendingRender = true; else render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !busyTyping()){ pendingRender = false; render(); } }, 50));

function applyRec(key, v){
  if (key === "meta"){ db.students = v ? v.students || [] : []; db.events = v ? v.events || [] : []; db.lastBackup = v ? v.lastBackup || null : null; db.schulen = v ? v.schulen || null : null; db.notiz = v ? v.notiz || "" : ""; db.pdfSync = v && typeof v.pdfSync === "boolean" ? v.pdfSync : undefined; }
  else if (key === "books") books = v ? v.books || [] : [];
  else if (key.startsWith("ink:")){ const k = key.slice(4); if (v) ink[k] = v; else delete ink[k]; if (typeof pvInkRemote === "function") pvInkRemote(k); }
  else if (key.startsWith("lesson:")){ const id = key.slice(7), i = db.lessons.findIndex(l => l.id === id); if (v){ v.id = id; if (i < 0) db.lessons.push(v); else db.lessons[i] = v; } else if (i >= 0) db.lessons.splice(i, 1); }
}

/* --- Sync --- */
async function pushOutbox(){
    while (cfg.outbox.length){
      const batch = []; let size = 0; const done = [];
      for (const key of cfg.outbox){
        const r = await idbGet("rec", key);
        const items = [];
        if (!r) items.push({key, part:0, parts:1, del:true});
        else { const data = await encObj(r.v); const n = Math.max(1, Math.ceil(data.length / PART)); for (let p = 0; p < n; p++) items.push({key, part:p, parts:n, data: data.slice(p * PART, (p + 1) * PART)}); }
        const len = items.reduce((a, x) => a + (x.data ? x.data.length : 0) + 100, 0);
        if (batch.length && (size + len > BATCH || batch.length + items.length > MAXITEMS)) break;
        if (len > BATCH){ for (const it of items) await api("push", {items:[it]}); done.push(key); continue; }
        batch.push(...items); size += len; done.push(key);
        if (size > BATCH * 0.8 || batch.length >= MAXITEMS) break;
      }
      if (batch.length) await api("push", {items: batch});
      cfg.outbox = cfg.outbox.filter(k => !done.includes(k)); await saveCfg();
      if (cfg.outbox.length) setSync(`Synchronisiert … noch ${cfg.outbox.length} Einträge`);
    }
}
function syncSoon(ms){ clearTimeout(syncT); syncT = setTimeout(sync, ms || 0); }
async function sync(){
  if (!acc || !navigator.onLine) { if (acc) setSync("Offline – wird später synchronisiert"); return; }
  if (syncing){ syncAgain = true; return; }
  syncing = true; syncErr = "";
  try {
    setSync("Synchronisiert …");
    // 1. Hochladen
    await pushOutbox();
    // 2. PDFs hochladen
    if (!pdfSyncOn() && cfg.uploads.length) await pdfToLocal();
    const ups = [...cfg.uploads];
    for (let i = 0; i < ups.length; i++){ await uploadPdf(ups[i], i + 1, ups.length); cfg.uploads = cfg.uploads.filter(x => x !== ups[i]); await saveCfg(); }
    if (ups.length){ setSync("PDFs hochgeladen, wird abgeglichen …"); await pushOutbox(); }
    // 3. Herunterladen
    let since = Math.max(0, (cfg.since || 0) - 120000 * 1000), maxRev = cfg.since || 0, changed = false;
    const local = await idbAll("rec"), acc2 = {};
    for (;;){
      const r = await api("pull", {since});
      for (const it of r.items){
        since = Math.max(since, it.rev); maxRev = Math.max(maxRev, it.rev);
        const g = acc2[it.key] ||= {parts: it.parts, p: {}, del: false, rev: 0};
        if (g.parts !== it.parts){ g.parts = it.parts; g.p = {}; }
        g.p[it.part] = it.data; g.del = it.del; g.rev = Math.max(g.rev, it.rev);
      }
      if (!r.more) break;
    }
    for (const [key, g] of Object.entries(acc2)){
      if (cfg.outbox.includes(key)) continue;
      const cur = local[key];
      if (cur && cur.rev >= g.rev) continue;
      if (g.del){ if (cur){ await idbDel("rec", key); if (!key.startsWith("pdf:")) applyRec(key, null); else { const id = key.slice(4); pdfNote(id, null); try { await idbDel("pdf", id); } catch(e) {} pdfLocal.delete(id); } changed = true; } continue; }
      if (Object.keys(g.p).length !== g.parts) continue;
      let v; try { v = await decObj(Array.from({length: g.parts}, (_, i) => g.p[i]).join("")); } catch(e) { continue; }
      await idbPut("rec", key, {v, rev: g.rev});
      if (key.startsWith("pdf:")){ pdfNote(key.slice(4), v); changed = true; }
      if (!key.startsWith("pdf:")){ applyRec(key, v); changed = true; }
    }
    cfg.since = maxRev; await saveCfg();
    lastSync = Date.now(); setSync("Synchronisiert");
    if (changed) remoteRender();
  } catch(e) {
    if (e.code === "rate"){ syncErr = ""; setSync("Server kurz ausgelastet – geht in einer Minute weiter"); syncing = false; syncSoon(65000); return; }
    syncErr = e.code === "auth" ? "Anmeldung abgelaufen oder Passwort geändert." : /fetch|network|load failed/i.test(e.message || "") ? "Server nicht erreichbar oder Zeitüberschreitung." : (e.message || "Fehler");
    setSync(e.code === "auth" ? "Sync: bitte neu anmelden" : "Sync fehlgeschlagen – neuer Versuch folgt");
    if (e.code !== "auth") syncSoon(30000);
  }
  syncing = false;
  if (syncAgain){ syncAgain = false; syncSoon(500); }
}
window.addEventListener("online", () => syncSoon(500));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncSoon(300); else flush(); });
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 60000);
window.addEventListener("pagehide", () => flush());

/* --- PDFs: lokal unverschlüsselt im Gerät, auf dem Server verschlüsselt in Stücken ---
   Mit «Nur auf diesem Gerät» (db.pdfSync === false) gehen nur die Angaben (Name, Seiten) in den Sync, nicht die Datei. */
const pdfMeta = {}; let pdfLocal = new Set(), pdfAny = false;
function pdfNote(id, v){ if (!v){ delete pdfMeta[id]; return; } pdfMeta[id] = {name: v.name || "", files: (v.files || []).length, pending: !!v.pending}; if (pdfMeta[id].files) pdfAny = true; }
async function pdfScanLocal(){ try { pdfLocal = new Set(await new Promise((ok, no) => { const r = idb.transaction("pdf").objectStore("pdf").getAllKeys(); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); })); } catch(e) {} }
// Ohne ausdrückliche Wahl: synchronisieren nur, wenn das Konto schon PDFs auf dem Server hat (bestehende Konten)
const pdfSyncOn = () => typeof db.pdfSync === "boolean" ? db.pdfSync : pdfAny;
async function pdfToLocal(){
  for (const id of cfg.uploads){ const r = await idbGet("rec", "pdf:" + id); if (r && r.v){ r.v.pending = false; r.v.local = true; await idbPut("rec", "pdf:" + id, r); pdfNote(id, r.v); cfg.outbox.includes("pdf:" + id) || cfg.outbox.push("pdf:" + id); } }
  cfg.uploads = []; await saveCfg();
}
async function setPdfSync(on){
  db.pdfSync = on; save();
  if (on){
    for (const id of pdfLocal){ const r = await idbGet("rec", "pdf:" + id); if (r && r.v && !(r.v.files || []).length){ r.v.pending = true; r.v.local = false; await idbPut("rec", "pdf:" + id, r); pdfNote(id, r.v); cfg.uploads.includes(id) || cfg.uploads.push(id); } }
    await saveCfg();
  } else await pdfToLocal();
  syncSoon(500); render();
}
function pdfNameMap(){ const m = {}; for (const [id, x] of Object.entries(pdfMeta)) if (x.name && !pdfLocal.has(id)) m[x.name] = id; return m; }
function pdfMissing(){ const ids = new Set(); for (const b of books) for (const t of b.teile || []) if (t.a && !pdfLocal.has(t.a) && !(pdfMeta[t.a] && pdfMeta[t.a].files)) ids.add(b.id); return ids.size; }
function pdfMissingBanner(){
  if (mode !== "app") return ""; const n = pdfMissing(); if (!n) return "";
  return `<div class="banner">${n === 1 ? "1 Heft ist" : n + " Hefte sind"} nicht auf diesem Gerät gespeichert. Tippe auf «PDF hinzufügen» und wähle dieselben Dateien wie auf dem anderen Gerät, dann werden sie am Dateinamen erkannt und zugeordnet.</div>`;
}
function pdfCard(){
  if (!acc) return ""; const on = pdfSyncOn();
  // Die Wahl «Über den Server» gibt es nur für Konten, die schon PDFs auf dem Server haben (Adrian)
  if (!pdfAny && db.pdfSync !== true) return `<h3>PDFs</h3><div class="card"><p class="small muted" style="max-width:65ch;margin:0">Deine PDFs bleiben auf dem Gerät. Titel, Seiten, Lesezeichen, Zuweisungen und Stiftnotizen werden synchronisiert. Auf einem weiteren Gerät fügst du dieselben PDF-Dateien einmal hinzu, sie werden am Dateinamen erkannt. <span class="num">${pdfLocal.size} PDF${pdfLocal.size === 1 ? "" : "s"} auf diesem Gerät.</span></p></div>`;
  return `<h3>PDFs</h3><div class="card"><div class="seg"><button class="${on ? "" : "on"}" data-a="pdfSync" data-v="">Nur auf diesem Gerät</button><button class="${on ? "on" : ""}" data-a="pdfSync" data-v="1">Über den Server synchronisieren</button></div>
    <p class="small muted" style="max-width:65ch;margin-bottom:0">${on
      ? "Neue PDFs werden verschlüsselt auf den Server geladen und erscheinen auf allen deinen Geräten."
      : "Deine PDFs bleiben auf dem Gerät und belegen keinen Platz auf dem Server. Titel, Seiten, Lesezeichen, Zuweisungen und Stiftnotizen werden trotzdem synchronisiert. Auf einem weiteren Gerät fügst du dieselben PDF-Dateien einmal hinzu, sie werden am Dateinamen erkannt."}
      <span class="num">${pdfLocal.size} PDF${pdfLocal.size === 1 ? "" : "s"} auf diesem Gerät.</span></p></div>`;
}
async function storePdf(id, u8, n, name){
  await idbPut("pdf", id, u8); pdfLocal.add(id);
  const old = await idbGet("rec", "pdf:" + id);
  if (old && old.v && (old.v.files || []).length){ pdfNote(id, old.v); return; }   // liegt schon auf dem Server
  const up = !acc || pdfSyncOn();
  const v = {files:[], n, size: u8.length, name, pending: up, local: !up};
  await idbPut("rec", "pdf:" + id, {v, rev:0}); pdfNote(id, v);
  if (acc){ if (up){ cfg.uploads.includes(id) || cfg.uploads.push(id); } else { cfg.outbox.includes("pdf:" + id) || cfg.outbox.push("pdf:" + id); } await saveCfg(); syncSoon(1000); }
}
function postFile(url, fd, onProgress){
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest(); x.open("POST", url); x.timeout = 15 * 60000;
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { if (x.status >= 200 && x.status < 300){ try { ok(JSON.parse(x.responseText)); } catch(e) { no(new Error("Upload: ungültige Antwort")); } } else no(new Error("Upload " + x.status)); };
    x.onerror = () => no(new Error("Upload: keine Verbindung")); x.ontimeout = () => no(new Error("Upload: Zeitüberschreitung"));
    x.send(fd);
  });
}
async function uploadPdf(id, nr, total){
  const r = await idbGet("rec", "pdf:" + id); if (!r || !r.v.pending) return;
  const u8 = await idbGet("pdf", id); if (!u8) return;
  const enc = await encBytes(u8 instanceof Uint8Array ? u8 : new Uint8Array(u8)), files = [];
  for (let o = 0; o < enc.length; o += CHUNK){
    const label = (r.v.name || "PDF").replace(/\.pdf$/i, ""), mb = (enc.length / 1048576).toFixed(1);
    const show = f => setSync(`PDF ${nr || 1} von ${total || 1} wird hochgeladen: ${label} (${mb} MB) … ${Math.round((o + f * Math.min(CHUNK, enc.length - o)) / enc.length * 100)} %`);
    show(0);
    const {uploadUrl, uploadToken} = await api("uploadurl", {});
    const fd = new FormData(); fd.append("upload_token", uploadToken || ""); fd.append("file", new Blob([enc.subarray(o, o + CHUNK)], {type:"application/pdf"}), "kb.pdf");
    const j = await postFile(uploadUrl, fd, show);
    files.push((Array.isArray(j) ? j[0] : j).file_name);
  }
  const v = {...r.v, files, pending:false, local:false};
  await idbPut("rec", "pdf:" + id, {v, rev:0}); pdfNote(id, v);
  cfg.outbox.includes("pdf:" + id) || cfg.outbox.push("pdf:" + id); await saveCfg();
}
async function pdfBytes(id){
  const have = await idbGet("pdf", id); if (have) return have instanceof Uint8Array ? have : new Uint8Array(have);
  if (!acc) throw new Error("Dieses PDF ist auf diesem Gerät nicht vorhanden.");
  let r = await idbGet("rec", "pdf:" + id);
  if (!r){ await sync(); r = await idbGet("rec", "pdf:" + id); }
  if (r && r.v && r.v.local && !(r.v.files || []).length) throw new Error(`Dieses PDF${r.v.name ? " («" + r.v.name + "»)" : ""} ist nur auf einem anderen Gerät gespeichert. Füge es hier unter Literatur mit «PDF hinzufügen» hinzu.`);
  if (!r || !r.v.files || !r.v.files.length) throw new Error("Dieses PDF ist noch nicht hochgeladen. Öffne es auf dem Gerät, auf dem du es hinzugefügt hast, oder füge es hier hinzu.");
  const parts = [];
  for (const f of r.v.files){ const x = await fetch(FILES + f); if (!x.ok) throw new Error("http " + x.status); parts.push(new Uint8Array(await x.arrayBuffer())); }
  const all = new Uint8Array(parts.reduce((a, p) => a + p.length, 0)); let o = 0; parts.forEach(p => { all.set(p, o); o += p.length; });
  const u8 = await decBytes(all);
  try { await idbPut("pdf", id, u8); } catch(e) {}
  return u8;
}

/* --- Start --- */
async function startApp(){
  try { idb = await idbOpen(); } catch(e) { mode = "app"; loaded = {meta:true, lessons:true}; setSync("Speicher nicht verfügbar"); render(); return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}
  cfg = Object.assign({since:0, outbox:[], uploads:[]}, await idbGet("cfg", "sync") || {});
  const a = await idbGet("cfg", "account"); if (a) await useAcc(a);
  const all = await idbAll("rec");
  for (const [k, r] of Object.entries(all)) if (!k.startsWith("pdf:")) applyRec(k, r.v); else pdfNote(k.slice(4), r.v);
  await pdfScanLocal();
  mode = "app"; assetsNs = true; loaded = {meta:true, lessons:true};
  setSync(acc ? "Bereit" : "Nur auf diesem Gerät");
  render();
  if (acc) syncSoon(200);
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const w = reg.installing; w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("Neue Version geladen. Beim nächsten Öffnen aktiv."); }); });
  }).catch(() => {});
}


/* --- Konto: anlegen, anmelden, Passwort vergessen/ändern, Wiederherstellungsschlüssel --- */
let rkShow = null, acctView = "in";

async function finishSignIn(a, keepLocal){
  await idbPut("cfg", "account", a); await useAcc(a);
  cfg = {since:0, outbox:[], uploads:[]};
  if (keepLocal){
    const all = await idbAll("rec");
    cfg.outbox = Object.keys(all).filter(k => !k.startsWith("pdf:") || !all[k].v.pending);
    cfg.uploads = Object.keys(all).filter(k => k.startsWith("pdf:") && all[k].v.pending).map(k => k.slice(4));
  } else {
    await tx("rec", "readwrite", s => s.clear()); await tx("pdf", "readwrite", s => s.clear()); pdfLocal = new Set();
    db = {students:[], lessons:[], events:[], lastBackup:null}; books = []; ink = {};
  }
  await saveCfg(); render(); await sync();
}
async function signUp(email, pw, invite){
  const d = await derive(email, pw), dek = crypto.getRandomValues(new Uint8Array(32)), rk = genRk(), r = await deriveRk(email, normRk(rk));
  await api("register", {acct: d.acct, auth: d.auth, rauth: r.rauth, wrapPw: await wrapKey(dek, d.kek), wrapRk: await wrapKey(dek, r.kek), invite});
  rkShow = rk;
  await finishSignIn({email: d.email, acct: d.acct, auth: d.auth, raw: b64(dek)}, true);
}
async function logIn(email, pw, keepLocal){
  const d = await derive(email, pw);
  const j = await api("login", {acct: d.acct, auth: d.auth});
  if (!j.wrapPw){ const e = new Error("old"); e.code = "old"; throw e; }
  const dek = await unwrapKey(j.wrapPw, d.kek);
  await finishSignIn({email: d.email, acct: d.acct, auth: d.auth, raw: b64(dek)}, keepLocal);
}
async function recoverAcc(email, rk, newPw, keepLocal){
  const n = normRk(rk); if (!n){ const e = new Error("rk"); e.code = "rk"; throw e; }
  const d = await derive(email, newPw), r = await deriveRk(email, n);
  const j = await api("recover", {acct: d.acct, rauth: r.rauth});
  const dek = await unwrapKey(j.wrapRk, r.kek);
  await api("rekey", {acct: d.acct, rauth: r.rauth, newAuth: d.auth, newWrapPw: await wrapKey(dek, d.kek)});
  await finishSignIn({email: d.email, acct: d.acct, auth: d.auth, raw: b64(dek)}, keepLocal);
}
async function changePw(oldPw, newPw){

function reportText(s){
  const p = progress(s), items = lpItems(s.stufe, s.instrumente||[]);
  const groups = {}; items.forEach(i => (groups[i.bereich] ||= []).push(i));
  const lines = [`Lernstand ${s.name}`, `Schlagzeug / Perkussion, ${s.schule}, Stand ${fmt(today(),1)}`, "", `Förderstufe: ${s.stufe}`, `Lehrplanziele dieser Stufe erreicht: ${p.done} von ${p.total} (${p.pct} %)`];
  Object.entries(groups).forEach(([b, its]) => { const d = its.filter(i=>s.lp[i.id]===2), w = its.filter(i=>s.lp[i.id]===1); if (!d.length && !w.length) return;
    lines.push("", b); if (d.length) lines.push("Erreicht:", ...d.map(i=>"- "+i.text)); if (w.length) lines.push("Daran arbeiten wir:", ...w.map(i=>"- "+i.text)); });
  const lr = litReport(s); if (lr.length) lines.push("", "Aktuelle Literatur:", ...lr.map(x => "- " + x));
  const up = eventsOf(s.id).filter(e => e.datum >= today());
  if (up.length) lines.push("", "Nächste Termine:", ...up.map(e => `- ${fmt(e.datum,1)}: ${e.titel} (${e.typ})${e.ort?", "+e.ort:""}`));
  return lines.join("\n");
}

function vKalender(){
  const from = calYear+"-08-01", to = (calYear+1)+"-07-31";
  const curSY = (() => { const d = new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear()-1; })();
  if (calYear < curSY) calYear = curSY;
  const evs = db.events.filter(e => (e.bis||e.datum) >= from && e.datum <= to).sort((a,b) => a.datum.localeCompare(b.datum));
  const kommend = evs.filter(e => (e.bis||e.datum) >= today());
  const bds = bdays(today(), to);
  const liste = [...kommend.map(e => ({d: e.datum, e})), ...bds.map(b => ({d: b.datum, b}))].sort((x, y) => x.d.localeCompare(y.d));
  const e = editEv ? db.events.find(x => x.id === editEv) : null;
  const f = e || {datum:today(), titel:"", typ:"Konzert", ort:"", sids:[], notiz:""};
  let html = `<div class="row" style="margin-bottom:12px"><button data-a="cy" data-n="-1" aria-label="Vorheriges Schuljahr" ${calYear <= curSY ? "disabled" : ""}>‹</button><h2 style="margin:0">Schuljahr ${calYear}/${String(calYear+1).slice(2)}</h2><button data-a="cy" data-n="1" aria-label="Nächstes Schuljahr">›</button></div>
  <div class="card" style="margin-bottom:14px" id="evform"><b>${e?"Termin bearbeiten":"Neuer Termin"}</b><div class="f" style="margin-top:8px">
    <div><label for="ev_datum">Datum</label><input type="date" id="ev_datum" value="${esc(f.datum)}"></div>
    <div><label for="ev_bis">Bis (optional)</label><input type="date" id="ev_bis" value="${esc(f.bis||"")}"></div>
    <div><label for="ev_typ">Typ</label><select id="ev_typ">${Object.keys(EVTYP).map(k=>`<option ${f.typ===k?"selected":""}>${k}</option>`).join("")}</select></div>
    <div style="grid-column:span 2"><label for="ev_titel">Titel</label><input id="ev_titel" value="${esc(f.titel)}" placeholder="Weihnachtsvorspiel"></div>
    <div><label for="ev_ort">Ort / Zeit</label><input id="ev_ort" value="${esc(f.ort)}" placeholder="Aula, 18:30"></div>
  </div>
  <label style="margin-top:10px">Wer macht mit?</label><div class="row" id="ev_sids">${sorted().map(s => `<button class="chip ${(f.sids||[]).includes(s.id)?"on":""}" data-a="evs" data-v="${s.id}">${esc(s.name)}</button>`).join("") || '<span class="tiny">Noch keine SuS erfasst.</span>'}</div>
  <div style="margin-top:8px"><label for="ev_notiz">Notiz</label><input id="ev_notiz" value="${esc(f.notiz||"")}" placeholder="Stücke, Anmeldeschluss"></div>
  <div class="row" style="margin-top:10px"><button class="pri" data-a="evsave">${e?"Speichern":"Termin hinzufügen"}</button>${e?`<button data-a="evcancel">Abbrechen</button><span class="sp"></span><button class="del" data-a="evdel">Löschen</button>`:""}<span class="small" id="everr" style="color:var(--da)"></span></div></div>
  <div class="row small" style="margin-bottom:8px">${Object.keys(EVTYP).map(k=>`<span><span class="dot" style="background:${EVCOL[k]}"></span>${k}</span>`).join(" ")} <span><span class="dot" style="background:var(--da)"></span>Geburtstag</span></div>
  <div class="months">`;
  for (let m = 0; m < 12; m++){
    const y = calYear + (m+7 >= 12 ? 1 : 0), mo = (m+7)%12;
    if (new Date(y, mo + 1, 0) < new Date(new Date().toDateString())) continue;
    const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate(), off = (first.getDay()+6)%7;
    let cells = "<tr>" + "<td></td>".repeat(off);
    for (let d = 1; d <= days; d++){
      const ds = iso(new Date(y, mo, d)); const ev = evs.find(x => ds >= x.datum && ds <= (x.bis||x.datum));
      const dow = (off+d-1)%7, endDs = ev ? (ev.bis||ev.datum) : "";
      const se = ev ? ((ds===ev.datum || dow===0 || d===1) ? " s" : "") + ((ds===endDs || dow===6 || d===days) ? " e" : "") : "";
      const bdh = bds.filter(x => x.datum === ds), tip = [ev ? ev.titel : "", ...bdh.map(x => "Geburtstag " + x.name)].filter(Boolean).join(", ");
      cells += `<td class="${ev?"ev"+se:""}${bdh.length?" bd":""}${ds===today()?" today":""}" ${ev?`style="--evc:${EVCOL[ev.typ]}"`:""} ${tip?`title="${esc(tip)}"`:""}>${d}</td>`;
      if ((off+d)%7 === 0) cells += "</tr><tr>";
    }
    html += `<div class="card mon"><b class="small">${first.toLocaleDateString("de-CH",{month:"long",year:"numeric"})}</b><table><tr>${["Mo","Di","Mi","Do","Fr","Sa","So"].map(t=>`<th>${t}</th>`).join("")}</tr>${cells}</tr></table></div>`;
  }

async function saveFile(filename, data, type){
  const dl = null;
  try { const file = new File([data], filename, {type}); if (navigator.canShare && navigator.canShare({files:[file]}) && matchMedia("(pointer:coarse)").matches){ await navigator.share({files:[file]}); return true; } } catch(e) { if (e && e.name === "AbortError") return false; }
  if (dl){ try { await dl.save({filename, data}); return true; } catch(e) { if (e && e.code === "declined") return false; toast("Die Datei konnte nicht gesichert werden."); return false; } }
  const u = URL.createObjectURL(new Blob([data], {type})), x = document.createElement("a");
  x.href = u; x.download = filename; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return true;
}

  const groups = {}; books.forEach(b => (groups[b.ordner || b.kat] ||= []).push(b));
  const opt = b => `<option value="${b.id}" ${b.id===sel?"selected":""}>${esc(b.titel)}${b.autor?" – "+esc(b.autor):""}</option>`;
  return (mine.length ? `<optgroup label="Passend: ${esc(s.stufe)}, ${esc((s.instrumente||[]).join(", "))}">${mine.map(opt).join("")}</optgroup>` : "")
    + Object.keys(groups).sort((a,b) => a.localeCompare(b)).map(g => `<optgroup label="${esc(g)}">${groups[g].map(opt).join("")}</optgroup>`).join("");
}

const VSPLIT = /^(.+?)\s+[–—-]\s+(.+)$/;
function litVoices(arr){
  const by = {}; arr.forEach(b => { const m = (b.titel || "").match(VSPLIT); if (m) (by[m[1].trim().toLowerCase()] ||= []).push(b); });
  const out = [], seen = new Set();
  for (const b of arr){
    const m = (b.titel || "").match(VSPLIT), k = m && m[1].trim().toLowerCase();
    if (k && by[k].length > 1){ if (!seen.has(k)){ seen.add(k); out.push({key: k, base: m[1].trim(), items: by[k]}); } }
    else out.push({b});
  }
  return out;
}

        <label style="margin-top:8px">Bereiche</label><div class="row" id="be-instr">${INSTR.map(k => `<button class="chip ${(b.instr||[]).includes(k)?"on":""}" data-a="evs" data-v="${k}">${k}</button>`).join("")}</div>

/* ---------- Notenviewer (pdf.js, im Hauptthread) ---------- */
let pdfjsP = null;
function loadPdfjs(){
  if (pdfjsP) return pdfjsP;
  const base = "vendor/";
  const add = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  pdfjsP = add(base + "pdf.min.js").then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return window.pdfjsLib; });
  pdfjsP.catch(() => { pdfjsP = null; });
  return pdfjsP;
}
const docCache = new Map();
function getDoc(a){
  if (docCache.has(a)) return docCache.get(a);
  const pr = (async () => {
    const lib = await loadPdfjs();
    const data = await pdfBytes(a);
    return lib.getDocument({data: data.slice(), isEvalSupported: false}).promise;
  })();
  docCache.set(a, pr); pr.catch(() => docCache.delete(a));
  while (docCache.size > 4){ const k = docCache.keys().next().value; const old = docCache.get(k); docCache.delete(k); old.then(d => d.destroy()).catch(() => {}); }
  return pr;
}
function locate(b, p){ let r = p; for (const t of b.teile){ if (r <= t.n) return {t, lp: r}; r -= t.n; } const t = b.teile[b.teile.length-1]; return {t, lp: t.n}; }
const pv = {b:null, p:1, zoom:1, fit:"page", sid:null, lit:null, tok:0, task:null, pop:null};
const $ = id => document.getElementById(id);
function openPdf(bid, p, ctx){
  const b = bookById(bid); if (!b){ toast("Dieses Heft ist nicht mehr im Katalog."); return; }
  if (!(b.teile||[]).length){ if ((b.links||[]).length) playLink(b.id, 0); else toast("Dieser Eintrag hat keine Noten. Unter «Bearbeiten» kannst du Aufnahmen verlinken."); return; }
  if (!b.teile.every(t => t.a)){ toast("Das PDF ist noch nicht hochgeladen."); return; }
  Object.assign(pv, {b, p: Math.max(1, Math.min(b.seiten, p || 1)), zoom: 1, sid: ctx?.sid || null, lit: ctx?.lit || null, pop: null});
  $("pv").hidden = false; document.body.style.overflow = "hidden";
  ink_.on = false; ink_.undo = []; ink_.cur = null;
  $("pvPlay").hidden = !(b.links || []).length; $("pvPlay").dataset.v = b.id;
  $("pvHere").hidden = !pv.lit; pvMarks(); pvPopRender(); inkBar(); pvShow();
}
function closePdf(){ ink_.on = false; ink_.cur = null; pv.drawing = false; $("pv").classList.remove("pv-ink"); $("pv").hidden = true; document.body.style.overflow = ""; pv.tok++; if (pv.task) try { pv.task.cancel(); } catch(e) {} render(); }
function pvMarks(){
  const sel = $("pvMarks"), m = (pv.b.marks || []).slice().sort((x,y) => x.p - y.p);
  sel.hidden = !m.length;
  sel.innerHTML = `<option value="">Lesezeichen …</option>` + m.map(x => `<option value="${x.p}">${esc(x.t)} · S. ${x.p - (pv.b.off||0)}</option>`).join("");
}
async function pvShow(){
  const b = pv.b, tok = ++pv.tok, off = b.off || 0;
  $("pvT").textContent = b.titel; $("pvP").value = pv.p - off; $("pvN").textContent = "/ " + (b.seiten - off);
  $("pvFit").textContent = pv.fit === "page" ? "Breite" : "Ganze Seite";
  const msg = $("pvMsg"), c = $("pvC"), body = $("pvBody"), pg = $("pvPg");
  const slow = setTimeout(() => { if (tok === pv.tok){ msg.textContent = "Noten werden geladen …"; pg.hidden = true; } }, 250);
  const {t, lp} = locate(b, pv.p);
  try {
    const doc = await getDoc(t.a); if (tok !== pv.tok) return;
    const page = await doc.getPage(Math.min(lp, doc.numPages)); if (tok !== pv.tok) return;
    const w = body.clientWidth - 16, h = body.clientHeight - 16, v1 = page.getViewport({scale: 1});
    const base = pv.fit === "width" ? w / v1.width : Math.min(w / v1.width, h / v1.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5), vp = page.getViewport({scale: base * pv.zoom * dpr});
    const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    if (pv.task) try { pv.task.cancel(); } catch(e) {}
    pv.task = page.render({canvasContext: cv.getContext("2d"), viewport: vp});
    await pv.task.promise; if (tok !== pv.tok) return;
    clearTimeout(slow);
    c.width = cv.width; c.height = cv.height; c.getContext("2d").drawImage(cv, 0, 0);
    c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px"; pg.hidden = false; msg.textContent = "";
    inkDraw();
    body.scrollTop = 0; body.scrollLeft = Math.max(0, (body.scrollWidth - body.clientWidth) / 2);
    const nx = locate(b, Math.min(pv.p + 1, b.seiten)); if (nx.t !== t) getDoc(nx.t.a).catch(() => {});
  } catch(e) {
    clearTimeout(slow);
    if (tok === pv.tok && !(e && e.name === "RenderingCancelledException")){ pg.hidden = true; msg.textContent = e && /PDF/.test(e.message || "") ? e.message : "Das PDF konnte nicht geladen werden. Prüfe die Verbindung und versuche es nochmals."; }
  }
}
function pvGo(p){ if (!pv.b) return; const n = Math.max(1, Math.min(pv.b.seiten, p)); if (n !== pv.p){ pv.p = n; pvShow(); } else $("pvP").value = pv.p - (pv.b.off||0); }
function pvPopRender(){
  const el = $("pvPop"), off = pv.b.off || 0;
  if (!pv.pop){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  if (pv.pop === "assign"){
    const list = sorted();
    el.innerHTML = `<div class="row"><b class="small">Für SuS merken</b>
      <select id="pvS" aria-label="Schüler:in">${list.map(s => `<option value="${s.id}" ${s.id===pv.sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
      <input id="pvSt" placeholder="Stück / Übung (optional)" aria-label="Stück">
      <input id="pvSe" type="number" inputmode="numeric" value="${pv.p - off}" style="flex:0 0 80px" aria-label="Seite">
      <button class="pri" data-pv="assignOk">Merken</button><button class="ghost" data-pv="popx">Abbrechen</button></div>`;
  } else {
    const m = (pv.b.marks || []).slice().sort((x,y) => x.p - y.p);
    el.innerHTML = `<div class="row"><b class="small">Lesezeichen auf S. ${pv.p - off}</b>
      <input id="pvMk" placeholder="Name, z. B. Etüde Nr. 12" aria-label="Name des Lesezeichens">
      <button class="pri" data-pv="markOk">Speichern</button><button class="ghost" data-pv="popx">Schliessen</button></div>
      ${m.length ? `<div class="row" style="margin-top:8px;gap:4px">${m.map((x,i) => `<span class="chip" style="cursor:default">${esc(x.t)} · S. ${x.p - off} <button class="ghost del" style="min-height:0;padding:0 0 0 6px" data-pv="markDel" data-i="${pv.b.marks.indexOf(x)}" aria-label="Lesezeichen löschen">×</button></span>`).join("")}</div>` : ""}`;
    setTimeout(() => $("pvMk")?.focus(), 0);
  }
}
$("pv").addEventListener("click", ev => {
  const t = ev.target.closest("[data-pv]"); if (!t) return;
  const off = pv.b.off || 0;
  switch (t.dataset.pv){
    case "close": closePdf(); break;
    case "prev": pvGo(pv.p - 1); break;
    case "next": pvGo(pv.p + 1); break;

$("pvP").addEventListener("change", e => pvGo((+e.target.value || 1) + (pv.b.off || 0)));

(() => { let x0 = null, y0 = 0; const body = $("pvBody");
  body.addEventListener("touchstart", e => { if (e.touches.length === 1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, {passive: true});

/* ---------- Stiftnotizen im Notenviewer: pro Schüler:in und Heft, Linien in Seitenkoordinaten (0–10000) ---------- */
const INK_C = {r:"#d0302f", b:"#1f5fbf", k:"#1b1b1b", y:"#ffd84a"};
const ink_ = {on:false, tool:"pen", col:"r", hide:false, cur:null, erased:null, undo:[], stylus:false, raf:0};
try { ink_.stylus = localStorage.getItem("kb-stylus") === "1"; } catch(e) {}
const inkKey = () => pv.sid && pv.b ? pv.sid + ":" + pv.b.id : null;
function inkList(create){
  const k = inkKey(); if (!k) return null;
  if (!ink[k]){ if (!create) return null; ink[k] = {p:{}}; }
  const d = ink[k]; d.p ||= {};
  if (!d.p[pv.p] && create) d.p[pv.p] = [];
  return d.p[pv.p] || null;
}
function inkSave(k){
  const d = ink[k];
  if (d){ for (const pg of Object.keys(d.p || {})) if (!d.p[pg].length) delete d.p[pg]; if (!Object.keys(d.p || {}).length) delete ink[k]; }
  saveInk(k);
}
function inkStroke(g, s, W, H){
  const p = s.pts; if (!p || p.length < 2) return;
  const X = i => p[i] * W / 10000, Y = i => p[i + 1] * H / 10000;
  g.strokeStyle = INK_C[s.c] || "#000"; g.lineWidth = Math.max(1, s.w * W / 10000); g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath(); g.moveTo(X(0), Y(0));

  if (p.length > 2) g.lineTo(X(p.length - 2), Y(p.length - 2));

}
function inkDraw(){
  const cv = $("pvI"), c = $("pvC"); if (!cv || !c) return;
  if (cv.width !== c.width || cv.height !== c.height){ cv.width = c.width; cv.height = c.height; }
  const g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  if (ink_.hide) return;
  const st = (inkList(false) || []).concat(ink_.cur ? [ink_.cur] : []);

}
const inkReq = () => { if (!ink_.raf) ink_.raf = requestAnimationFrame(() => { ink_.raf = 0; inkDraw(); }); };
function pvInkRemote(k){ if (!$("pv").hidden && k === inkKey() && !pv.drawing) inkDraw(); }
function inkBar(){
  const el = $("pvInk"); $("pvInkB").classList.toggle("on", ink_.on); $("pv").classList.toggle("pv-ink", ink_.on);
  if (!ink_.on){ el.hidden = true; el.innerHTML = ""; return; }
  const list = sorted(), names = {r:"rot", b:"blau", k:"schwarz"};
  el.hidden = false;
  el.innerHTML = `<div class="row ink-row">
    <select id="pvInkS" aria-label="Notizen für">${pv.sid ? "" : `<option value="">Notizen für …</option>`}${list.map(s => `<option value="${s.id}" ${s.id === pv.sid ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
    ${["r","b","k"].map(c => `<button class="ink-t ${ink_.tool === "pen" && ink_.col === c ? "on" : ""}" data-ink="pen" data-c="${c}" aria-label="Stift ${names[c]}" title="Stift ${names[c]}"><i style="background:${INK_C[c]}"></i></button>`).join("")}
    <button class="ink-t ${ink_.tool === "hl" ? "on" : ""}" data-ink="hl" aria-label="Textmarker" title="Textmarker"><i class="hl" style="background:${INK_C.y}"></i></button>
    <button class="ink-t ${ink_.tool === "erase" ? "on" : ""}" data-ink="erase">Radierer</button>
    <button data-ink="undo" ${ink_.undo.length ? "" : "disabled"}>Rückgängig</button>
    <button class="ghost" data-ink="hide">${ink_.hide ? "Einblenden" : "Ausblenden"}</button>
    <button class="ghost del" data-ink="clear">Seite leeren</button>
    <button class="pri" data-ink="done">Fertig</button></div>
    ${!pv.sid ? `<div class="small muted" style="margin-top:6px">Wähle, für wen die Notizen gelten. Sie erscheinen, wenn du das Heft bei dieser Person öffnest.</div>`
      : !ink_.stylus ? `<div class="small muted" style="margin-top:6px">Mit dem Apple Pencil schreiben, mit dem Finger blättern und scrollen. Solange kein Stift erkannt ist, zeichnet auch der Finger.</div>` : ""}`;
}
$("pvInk").addEventListener("change", e => {
  if (e.target.id !== "pvInkS") return;
  pv.sid = e.target.value || null; pv.lit = null; $("pvHere").hidden = true; ink_.undo = []; inkBar(); inkDraw();
});
$("pvInk").addEventListener("click", e => {
  const b = e.target.closest("[data-ink]"); if (!b) return;
  const k = inkKey();
  switch (b.dataset.ink){
    case "pen": ink_.tool = "pen"; ink_.col = b.dataset.c; ink_.hide = false; break;
    case "hl": ink_.tool = "hl"; ink_.hide = false; break;
    case "erase": ink_.tool = "erase"; ink_.hide = false; break;
    case "hide": ink_.hide = !ink_.hide; break;
    case "done": ink_.on = false; break;
    case "undo": {
      const u = ink_.undo.pop(); if (!u) break;

(() => {
  const I = $("pvI");
  const pt = e => { const r = I.getBoundingClientRect(); return [Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * 10000), Math.round(Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) * 10000)]; };
  const allowed = e => ink_.on && !ink_.hide && !!inkKey() && (e.pointerType === "pen" || e.pointerType === "mouse" || !ink_.stylus);
  const noteStylus = () => { if (!ink_.stylus){ ink_.stylus = true; try { localStorage.setItem("kb-stylus", "1"); } catch(e) {} if (ink_.on) inkBar(); } };
  // Auf dem iPad: der Stift zeichnet (kein Scrollen), der Finger scrollt – ausser es wurde noch nie ein Stift benutzt
  const blockTouch = e => { const t = e.touches[0]; if (!t) return; const stylus = t.touchType === "stylus"; if (stylus) noteStylus(); if (ink_.on && !ink_.hide && inkKey() && (stylus || !ink_.stylus)) e.preventDefault(); };

    const list = inkList(false); if (!list) return;

      const s = list[i], r = 120 + s.w / 2, r2 = r * r;
      for (let j = 0; j < s.pts.length; j += 2){ const dx = s.pts[j] - p[0], dy = s.pts[j + 1] - p[1]; if (dx * dx + dy * dy <= r2){ ink_.erased.push(...list.splice(i, 1)); break; } }
    }
  };
  I.addEventListener("pointerdown", e => {

    if (!allowed(e) || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault(); try { I.setPointerCapture(e.pointerId); } catch(err) {}
    pv.drawing = e.pointerId; const p = pt(e);
    if (ink_.tool === "erase"){ ink_.erased = []; erase(p); inkReq(); return; }
    const hl = ink_.tool === "hl";
    ink_.cur = {t: hl ? "hl" : "pen", c: hl ? "y" : ink_.col, w: hl ? 150 : 24, pts: p};
    inkReq();
  });
  I.addEventListener("pointermove", e => {
    if (pv.drawing !== e.pointerId) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])){

      else if (ink_.cur){ const a = ink_.cur.pts, dx = p[0] - a[a.length - 2], dy = p[1] - a[a.length - 1]; if (dx * dx + dy * dy >= 9) a.push(p[0], p[1]); }
    }
    inkReq();
  });
  const end = e => {
    if (pv.drawing !== e.pointerId) return;
    pv.drawing = false; const k = inkKey();
    if (ink_.cur){ const s = ink_.cur; ink_.cur = null; inkList(true).push(s); ink_.undo.push({k, pg: pv.p, add: s}); inkSave(k); }
    if (ink_.erased){ if (ink_.erased.length){ ink_.undo.push({k, pg: pv.p, del: ink_.erased}); inkSave(k); } ink_.erased = null; }
    if (ink_.undo.length > 100) ink_.undo.shift();
    inkBar(); inkDraw();
  };
  I.addEventListener("pointerup", end); I.addEventListener("pointercancel", end);
})();

$("pdfIn").onchange = async e => {

      books.push({id: uid(), titel: f.name.replace(/\.pdf$/i, ""), autor: "", kat: "Unterrichtsblätter", ordner: "Neu hinzugefügt", instr: [], seiten: n, off: 0, teile: [{a: id, n}], marks: [], stufen: []});
