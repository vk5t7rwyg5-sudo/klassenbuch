<style>
/* Layout: sticky tab bar over a single working column; cards only for lessons, people and calendar months */
:root{--bg:#f5f5f2;--card:#fff;--soft:#ecece6;--tx:#1e1f1c;--tx2:#5c5e57;--tx3:#868880;--bd:#deded6;--bd2:#c9cac0;
--ac:#1d5a8f;--acbg:#e3eef8;--ok:#3b6d11;--okbg:#e8f2dc;--wa:#7d4a0a;--wabg:#f8ecd6;--da:#a32d2d;--dabg:#fbe8e8;--pu:#534ab7;--pubg:#eceafd;--te:#0f6e56;--tebg:#dff3ec;
--paper:#fff;--display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--r:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b19;--card:#242522;--soft:#2e2f2b;--tx:#eeeee8;--tx2:#b3b4ab;--tx3:#878980;--bd:#383934;--bd2:#4a4b45;
--ac:#8dbbe8;--acbg:#16395a;--ok:#9fca62;--okbg:#26401a;--wa:#f2c27a;--wabg:#4f3410;--da:#f09a9a;--dabg:#5a2020;--pu:#b2acef;--pubg:#353070;--te:#68d0ad;--tebg:#0e4436;--paper:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1b19;--card:#242522;--soft:#2e2f2b;--tx:#eeeee8;--tx2:#b3b4ab;--tx3:#878980;--bd:#383934;--bd2:#4a4b45;
--ac:#8dbbe8;--acbg:#16395a;--ok:#9fca62;--okbg:#26401a;--wa:#f2c27a;--wabg:#4f3410;--da:#f09a9a;--dabg:#5a2020;--pu:#b2acef;--pubg:#353070;--te:#68d0ad;--tebg:#0e4436;--paper:#fff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.top{max-width:1100px;margin:auto;padding-block:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:17px;margin-right:10px;letter-spacing:-.01em}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav a{color:var(--tx2);text-decoration:none;padding:7px 12px;border-radius:var(--r);font-size:14px}
nav a.on{background:var(--acbg);color:var(--ac);font-weight:500}
#sync{font-size:12px;color:var(--tx3);margin-left:auto}
main{max-width:1100px;margin:auto;padding-block:16px 60px}
h2{font-family:var(--display);font-size:22px;font-weight:700;margin:4px 0 14px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:13px;font-weight:600;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 12px;cursor:pointer;min-height:34px;text-decoration:none;display:inline-flex;align-items:center}
button:hover,.btn:hover{background:var(--soft)}button.pri{background:var(--ac);border-color:var(--ac);color:var(--card)}
button.ghost{border-color:transparent;background:none}button.del{color:var(--da)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--tx);background:var(--card);border:1px solid var(--bd2);border-radius:var(--r);padding:7px 9px;width:100%}
textarea{min-height:58px;resize:vertical;overflow-y:hidden}
label{font-size:12px;color:var(--tx2);display:block;margin-bottom:3px}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.b-ac{background:var(--acbg);color:var(--ac)}.b-ok{background:var(--okbg);color:var(--ok)}.b-wa{background:var(--wabg);color:var(--wa)}.b-da{background:var(--dabg);color:var(--da)}.b-pu{background:var(--pubg);color:var(--pu)}.b-te{background:var(--tebg);color:var(--te)}.b-gr{background:var(--soft);color:var(--tx2)}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--bd2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:4px 10px;font-size:13px;border-right:1px solid var(--bd)}.seg button:last-child{border-right:0}
.seg button.on{background:var(--acbg);color:var(--ac)}
.seg button.on.s-anwesend{background:var(--okbg);color:var(--ok)}.seg button.on.s-entschuldigt{background:var(--wabg);color:var(--wa)}.seg button.on.s-unentschuldigt{background:var(--dabg);color:var(--da)}
.lesson{margin-bottom:10px}.lesson .fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.hint{background:var(--soft);border-radius:var(--r);padding:6px 10px;font-size:13px;color:var(--tx2);margin-top:8px}
.chip{font-size:13px;padding:4px 10px;border-radius:14px;border:1px solid var(--bd2);background:var(--card);cursor:pointer;min-height:30px;text-align:left}
.chip.on{background:var(--okbg);color:var(--ok);border-color:transparent}
.lp-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd)}
.lp-item:last-child{border-bottom:0}
.st{min-width:30px;min-height:30px;padding:0;border-radius:50%;font-size:14px;line-height:1;justify-content:center;flex:none}
.st.s1{background:var(--wabg);color:var(--wa);border-color:transparent}.st.s2{background:var(--okbg);color:var(--ok);border-color:transparent}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-weight:500;color:var(--tx2);font-size:13px}
.months{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mon table{font-size:12px;font-variant-numeric:tabular-nums}.mon td,.mon th{padding:2px;border:0;text-align:center}
.mon td{position:relative}
.mon td.ev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--evc)}
.mon td.ev.s::after{left:3px;border-radius:2px 0 0 2px}.mon td.ev.e::after{right:3px;border-radius:0 2px 2px 0}.mon td.ev.s.e::after{border-radius:2px}
.mon td.today{outline:1px solid var(--ac);outline-offset:-1px;border-radius:4px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.banner{background:var(--wabg);color:var(--wa);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:14px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
ul.plain{margin:4px 0 0;padding-left:18px}ul.plain li{margin:2px 0}
.report{max-width:760px;margin:auto}
.empty{text-align:center;padding:36px 16px}
.empty h2{margin-bottom:6px}
dialog{border:1px solid var(--bd2);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;max-width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:14px;z-index:40;max-width:calc(100vw - 32px)}
.wk{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.pk-list{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.pk-day{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin:10px 0 4px;font-weight:600}
.pk-day:first-child{margin-top:0}
.pk{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:6px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:var(--r);width:100%}
.pk:hover{background:var(--soft)}.pk.on{background:var(--acbg);color:var(--ac)}
.pk-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pk-s{display:flex;gap:6px;align-items:center;color:var(--tx3)}.pk .dot{margin:0}
.ed{padding:18px 20px}.ed-name{font-family:var(--display);font-size:22px;font-weight:700;color:var(--tx);text-decoration:none}
.ed-f{display:grid;gap:12px;margin-top:14px}.ed-2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ed textarea{font-size:16px;line-height:1.5}
.prev{margin-top:12px;background:var(--soft);border-radius:var(--r);padding:8px 12px;font-size:14px}.prev summary{cursor:pointer;color:var(--tx2)}.prev p{margin:6px 0;white-space:pre-wrap}
.ed-nav{margin-top:16px;border-top:1px solid var(--bd);padding-top:12px}
button:disabled{opacity:.4;cursor:default}
@media (max-width:760px){.wk{grid-template-columns:minmax(0,1fr)}.pk-list{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}.pk-day{display:none}.pk{grid-template-columns:auto auto auto;flex:none;width:auto;border:1px solid var(--bd2)}.ed{padding:14px}.ed-nav .sp{font-size:0}}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:-4px 0 14px}
.tl-bar{display:flex;gap:3px;width:min(260px,100%)}
.tl-bar i{flex:1;height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--bd)}
.tl-bar i.past{background:var(--acbg);border-color:transparent}.tl-bar i.now{background:var(--ac);border-color:transparent}
.sb{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media (max-width:600px){.brand{width:100%}#sync{margin-left:0}nav a{padding:6px 8px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
#pv{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.pv-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--bd);background:var(--card)}
.pv-t{font-weight:600;min-width:0;flex:1 1 160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-bar input.pg{width:62px;text-align:center;padding:6px 4px}
.pv-bar select{width:auto;max-width:200px}
.pv-pop{padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--bd)}
.pv-pop input,.pv-pop select{width:auto;flex:1 1 160px;min-width:0}
.pv-body{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:8px;background:var(--soft);-webkit-overflow-scrolling:touch}
.pv-body canvas{background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.18);max-width:none;flex:none}
#pvMsg{padding:40px 16px;text-align:center}
.lit-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lit-row:last-child{border-bottom:0}
.lit-row input.num{width:70px;padding:5px 6px}
.lit-add{display:grid;gap:8px;margin-top:12px;grid-template-columns:minmax(0,2fr) minmax(0,2fr) 80px auto;align-items:end}
@media (max-width:640px){.lit-add{grid-template-columns:minmax(0,1fr) 80px}.lit-add>div:first-child,.lit-add>div:nth-child(2){grid-column:1/-1}}
.bk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd)}
.bk:last-child{border-bottom:0}
.bk-i{width:34px;height:44px;border-radius:4px;background:var(--pubg);color:var(--pu);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.lit-card{padding:4px 0}
.lit-t{font-size:14px}.lit-t th,.lit-t td{padding:8px 10px;vertical-align:middle}.lit-t tbody tr:last-child td{border-bottom:0}

.lit-t tbody tr:hover{background:var(--soft)}
.th-s{padding:0;min-height:0;font-size:13px;color:var(--tx2);font-weight:500}.th-s.on{color:var(--ac)}
.lit-open{border:0;background:none;padding:0;min-height:0;font-weight:600;text-align:left;color:var(--tx);display:inline}
.lit-open:hover{background:none;color:var(--ac);text-decoration:underline}
.lit-marks{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.lit-marks .chip{min-height:24px;padding:1px 8px;font-size:12px}
.m-only{display:none}
.stk{display:inline-flex;gap:2px}.stk abbr{text-decoration:none;font-size:11px;font-weight:600;min-width:22px;text-align:center;padding:1px 4px;border-radius:4px;background:var(--wabg);color:var(--wa)}
.lit-t tr.lit-g th{background:var(--soft);color:var(--tx);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:6px 10px}
.lit-t tr.lit-g:hover{background:none}
@media (max-width:760px){.lit-t .c-a,.lit-t .c-b,.lit-t .c-s,.lit-t .c-k,.lit-t .c-st{display:none}.m-only{display:block}.lit-t th,.lit-t td{padding:8px 8px}}
</style>

<header class="gut"><div class="top"><span class="brand">Klassenbuch Schlagzeug</span><nav id="nav"></nav><span id="sync"></span></div></header>

<input type="file" id="fileIn" accept=".json,application/json" hidden>

</div>

/* --- IndexedDB --- */
function idbOpen(){
  return new Promise((ok, no) => {
    const r = indexedDB.open("klassenbuch", 1);
    r.onupgradeneeded = () => { const d = r.result; ["rec","pdf","cfg"].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  });
}
function tx(store, mode2, fn){
  return new Promise((ok, no) => { const t = idb.transaction(store, mode2), s = t.objectStore(store); let res; Promise.resolve(fn(s)).then(v => res = v); t.oncomplete = () => ok(res); t.onerror = t.onabort = () => no(t.error); });
}
const idbGet = (store, k) => new Promise((ok, no) => { const r = idb.transaction(store).objectStore(store).get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idbAll = store => new Promise((ok, no) => { const out = {}, r = idb.transaction(store).objectStore(store).openCursor(); r.onsuccess = () => { const c = r.result; if (c){ out[c.key] = c.value; c.continue(); } else ok(out); }; r.onerror = () => no(r.error); });
const idbPut = (store, k, v) => tx(store, "readwrite", s => { s.put(v, k); });
const idbDel = (store, k) => tx(store, "readwrite", s => { s.delete(k); });
const saveCfg = () => idbPut("cfg", "sync", cfg);

/* --- Krypto --- */
const te = new TextEncoder(), td = new TextDecoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
function b64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s){ const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function derive(email, pw){
  const salt = te.encode("klassenbuch-v1:" + email.trim().toLowerCase());
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:600000}, base, 512));
  return {email: email.trim().toLowerCase(), acct: hex(await crypto.subtle.digest("SHA-256", salt)).slice(0, 40), auth: hex(bits.slice(0, 32)), raw: b64(bits.slice(32))};
}
async function useAcc(a){ acc = {...a, key: await crypto.subtle.importKey("raw", unb64(a.raw), "AES-GCM", false, ["encrypt","decrypt"])}; }
async function encBytes(u8){ const iv = crypto.getRandomValues(new Uint8Array(12)); const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, acc.key, u8)); const o = new Uint8Array(12 + c.length); o.set(iv); o.set(c, 12); return o; }
async function decBytes(u8){ return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv: u8.subarray(0, 12)}, acc.key, u8.subarray(12))); }
const encObj = async o => b64(await encBytes(te.encode(JSON.stringify(o))));
const decObj = async s => JSON.parse(td.decode(await decBytes(unb64(s))));

/* --- Server --- */
async function api(action, body){
  const r = await fetch(SYNC + action, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({...body, acct: acc?.acct, auth: acc?.auth, ...(body.acct ? {acct: body.acct, auth: body.auth} : {})})});
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok){ const e = new Error(j.error || ("http " + r.status)); e.code = j.error || r.status; throw e; }
  return j;
}

/* --- Lokale Datensätze: meta, books, lesson:<id>, pdf:<id> --- */
function recOf(key){
  if (key === "meta") return {students: db.students, events: db.events, lastBackup: db.lastBackup};
  if (key === "books") return {books};
  if (key.startsWith("lesson:")) return db.lessons.find(l => l.id === key.slice(7)) || null;
  return undefined;
}
async function flush(){
  if (mode !== "app" || flushing){ if (flushing) schedule(); return; }
  flushing = true;
  try {
    const keys = [];
    if (metaDirty){ metaDirty = false; keys.push("meta"); }
    if (booksDirty){ booksDirty = false; keys.push("books"); }
    for (const id of [...dirtyL]){ dirtyL.delete(id); keys.push("lesson:" + id); }
    for (const id of [...delL]){ delL.delete(id); keys.push("lesson:" + id); }
    if (keys.length){
      await tx("rec", "readwrite", s => keys.forEach(k => { const v = recOf(k); if (v) s.put({v: structuredClone(v), rev: 0}, k); else s.delete(k); }));
      if (acc){ keys.forEach(k => cfg.outbox.includes(k) || cfg.outbox.push(k)); await saveCfg(); syncSoon(1500); }
      setSync(acc ? "Gespeichert, wird synchronisiert …" : "Auf diesem Gerät gespeichert");
    }
  } catch(e) { toast("Speichern auf dem Gerät ist fehlgeschlagen."); setSync("Nicht gespeichert"); }
  flushing = false;
  if (metaDirty || booksDirty || dirtyL.size || delL.size) schedule();
}
function busyTyping(){ const a = document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function remoteRender(){ if (!(loaded.meta && loaded.lessons)) return; if (!document.getElementById("pv").hidden) return; if (busyTyping()) pendingRender = true; else render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !busyTyping()){ pendingRender = false; render(); } }, 50));

function applyRec(key, v){
  if (key === "meta"){ db.students = v ? v.students || [] : []; db.events = v ? v.events || [] : []; db.lastBackup = v ? v.lastBackup || null : null; }
  else if (key === "books") books = v ? v.books || [] : [];
  else if (key.startsWith("lesson:")){ const id = key.slice(7), i = db.lessons.findIndex(l => l.id === id); if (v){ v.id = id; if (i < 0) db.lessons.push(v); else db.lessons[i] = v; } else if (i >= 0) db.lessons.splice(i, 1); }
}

/* --- Sync --- */
function syncSoon(ms){ clearTimeout(syncT); syncT = setTimeout(sync, ms || 0); }
async function sync(){
  if (!acc || !navigator.onLine) { if (acc) setSync("Offline – wird später synchronisiert"); return; }
  if (syncing){ syncAgain = true; return; }
  syncing = true; syncErr = "";
  try {
    setSync("Synchronisiert …");
    // 1. Hochladen
    while (cfg.outbox.length){
      const batch = []; let size = 0; const done = [];
      for (const key of cfg.outbox){
        const r = await idbGet("rec", key);
        const items = [];
        if (!r) items.push({key, part:0, parts:1, del:true});
        else { const data = await encObj(r.v); const n = Math.max(1, Math.ceil(data.length / PART)); for (let p = 0; p < n; p++) items.push({key, part:p, parts:n, data: data.slice(p * PART, (p + 1) * PART)}); }
        const len = items.reduce((a, x) => a + (x.data ? x.data.length : 0) + 100, 0);
        if (batch.length && size + len > BATCH) break;
        if (len > BATCH){ for (const it of items) await api("push", {items:[it]}); done.push(key); continue; }
        batch.push(...items); size += len; done.push(key);
        if (size > BATCH * 0.8) break;
      }
      if (batch.length) await api("push", {items: batch});
      cfg.outbox = cfg.outbox.filter(k => !done.includes(k)); await saveCfg();
    }
    // 2. PDFs hochladen
    for (const id of [...cfg.uploads]){ await uploadPdf(id); cfg.uploads = cfg.uploads.filter(x => x !== id); await saveCfg(); }
    // 3. Herunterladen
    let since = Math.max(0, (cfg.since || 0) - 120000 * 1000), maxRev = cfg.since || 0, changed = false;
    const local = await idbAll("rec"), acc2 = {};
    for (;;){
      const r = await api("pull", {since});
      for (const it of r.items){
        since = Math.max(since, it.rev); maxRev = Math.max(maxRev, it.rev);
        const g = acc2[it.key] ||= {parts: it.parts, p: {}, del: false, rev: 0};
        if (g.parts !== it.parts){ g.parts = it.parts; g.p = {}; }
        g.p[it.part] = it.data; g.del = it.del; g.rev = Math.max(g.rev, it.rev);
      }
      if (!r.more) break;
    }
    for (const [key, g] of Object.entries(acc2)){
      if (cfg.outbox.includes(key)) continue;
      const cur = local[key];
      if (cur && cur.rev >= g.rev) continue;
      if (g.del){ if (cur){ await idbDel("rec", key); if (!key.startsWith("pdf:")) applyRec(key, null); changed = true; } continue; }
      if (Object.keys(g.p).length !== g.parts) continue;
      let v; try { v = await decObj(Array.from({length: g.parts}, (_, i) => g.p[i]).join("")); } catch(e) { continue; }
      await idbPut("rec", key, {v, rev: g.rev});
      if (!key.startsWith("pdf:")){ applyRec(key, v); changed = true; }
    }
    cfg.since = maxRev; await saveCfg();
    lastSync = Date.now(); setSync("Synchronisiert");
    if (changed) remoteRender();
  } catch(e) {
    syncErr = e.code === "auth" ? "Anmeldung abgelaufen oder Passwort geändert." : (e.message || "Fehler");
    setSync(e.code === "auth" ? "Sync: bitte neu anmelden" : "Sync fehlgeschlagen – neuer Versuch folgt");
    if (e.code !== "auth") syncSoon(30000);
  }
  syncing = false;
  if (syncAgain){ syncAgain = false; syncSoon(500); }
}

async function storePdf(id, u8, n, name){
  await idbPut("pdf", id, u8);
  await idbPut("rec", "pdf:" + id, {v:{files:[], n, size: u8.length, name, pending:true}, rev:0});
  if (acc){ cfg.uploads.includes(id) || cfg.uploads.push(id); await saveCfg(); syncSoon(1000); }
}
async function uploadPdf(id){
  const r = await idbGet("rec", "pdf:" + id); if (!r || !r.v.pending) return;
  const u8 = await idbGet("pdf", id); if (!u8) return;
  const enc = await encBytes(u8 instanceof Uint8Array ? u8 : new Uint8Array(u8)), files = [];
  for (let o = 0; o < enc.length; o += CHUNK){
    setSync(`PDF wird hochgeladen … ${Math.round(o / enc.length * 100)} %`);
    const {uploadUrl, uploadToken} = await api("uploadurl", {});
    const fd = new FormData(); fd.append("upload_token", uploadToken || ""); fd.append("file", new Blob([enc.subarray(o, o + CHUNK)], {type:"application/pdf"}), "kb.pdf");
    const res = await fetch(uploadUrl, {method:"POST", body: fd}); if (!res.ok) throw new Error("Upload " + res.status);
    const j = await res.json(); files.push((Array.isArray(j) ? j[0] : j).file_name);
  }
  const v = {...r.v, files, pending:false};
  await idbPut("rec", "pdf:" + id, {v, rev:0});
  cfg.outbox.includes("pdf:" + id) || cfg.outbox.push("pdf:" + id); await saveCfg();
}
async function pdfBytes(id){
  const have = await idbGet("pdf", id); if (have) return have instanceof Uint8Array ? have : new Uint8Array(have);
  if (!acc) throw new Error("Dieses PDF ist auf diesem Gerät nicht vorhanden.");
  let r = await idbGet("rec", "pdf:" + id);
  if (!r){ await sync(); r = await idbGet("rec", "pdf:" + id); }
  if (!r || !r.v.files || !r.v.files.length) throw new Error("Dieses PDF ist noch nicht hochgeladen.");
  const parts = [];
  for (const f of r.v.files){ const x = await fetch(FILES + f); if (!x.ok) throw new Error("http " + x.status); parts.push(new Uint8Array(await x.arrayBuffer())); }
  const all = new Uint8Array(parts.reduce((a, p) => a + p.length, 0)); let o = 0; parts.forEach(p => { all.set(p, o); o += p.length; });
  const u8 = await decBytes(all);
  try { await idbPut("pdf", id, u8); } catch(e) {}
  return u8;
}

function reportText(s){
  const p = progress(s), items = lpItems(s.stufe, s.instrumente||[]);
  const groups = {}; items.forEach(i => (groups[i.bereich] ||= []).push(i));
  const lines = [`Lernstand ${s.name}`, `Schlagzeug / Perkussion, ${s.schule}, Stand ${fmt(today(),1)}`, "", `Förderstufe: ${s.stufe}`, `Lehrplanziele dieser Stufe erreicht: ${p.done} von ${p.total} (${p.pct} %)`];
  Object.entries(groups).forEach(([b, its]) => { const d = its.filter(i=>s.lp[i.id]===2), w = its.filter(i=>s.lp[i.id]===1); if (!d.length && !w.length) return;
    lines.push("", b); if (d.length) lines.push("Erreicht:", ...d.map(i=>"- "+i.text)); if (w.length) lines.push("Daran arbeiten wir:", ...w.map(i=>"- "+i.text)); });
  const lr = litReport(s); if (lr.length) lines.push("", "Aktuelle Literatur:", ...lr.map(x => "- " + x));
  const up = eventsOf(s.id).filter(e => e.datum >= today());
  if (up.length) lines.push("", "Nächste Termine:", ...up.map(e => `- ${fmt(e.datum,1)}: ${e.titel} (${e.typ})${e.ort?", "+e.ort:""}`));
  return lines.join("\n");
}

function vKalender(){
  const from = calYear+"-08-01", to = (calYear+1)+"-07-31";
  const evs = db.events.filter(e => (e.bis||e.datum) >= from && e.datum <= to).sort((a,b) => a.datum.localeCompare(b.datum));
  const e = editEv ? db.events.find(x => x.id === editEv) : null;
  const f = e || {datum:today(), titel:"", typ:"Konzert", ort:"", sids:[], notiz:""};
  let html = `<div class="row" style="margin-bottom:12px"><button data-a="cy" data-n="-1" aria-label="Vorheriges Schuljahr">‹</button><h2 style="margin:0">Schuljahr ${calYear}/${String(calYear+1).slice(2)}</h2><button data-a="cy" data-n="1" aria-label="Nächstes Schuljahr">›</button></div>
  <div class="card" style="margin-bottom:14px" id="evform"><b>${e?"Termin bearbeiten":"Neuer Termin"}</b><div class="f" style="margin-top:8px">
    <div><label for="ev_datum">Datum</label><input type="date" id="ev_datum" value="${esc(f.datum)}"></div>
    <div><label for="ev_bis">Bis (optional)</label><input type="date" id="ev_bis" value="${esc(f.bis||"")}"></div>
    <div><label for="ev_typ">Typ</label><select id="ev_typ">${Object.keys(EVTYP).map(k=>`<option ${f.typ===k?"selected":""}>${k}</option>`).join("")}</select></div>
    <div style="grid-column:span 2"><label for="ev_titel">Titel</label><input id="ev_titel" value="${esc(f.titel)}" placeholder="Weihnachtsvorspiel"></div>
    <div><label for="ev_ort">Ort / Zeit</label><input id="ev_ort" value="${esc(f.ort)}" placeholder="Aula, 18:30"></div>
  </div>
  <label style="margin-top:10px">Wer macht mit?</label><div class="row" id="ev_sids">${sorted().map(s => `<button class="chip ${(f.sids||[]).includes(s.id)?"on":""}" data-a="evs" data-v="${s.id}">${esc(s.name)}</button>`).join("") || '<span class="tiny">Noch keine SuS erfasst.</span>'}</div>
  <div style="margin-top:8px"><label for="ev_notiz">Notiz</label><input id="ev_notiz" value="${esc(f.notiz||"")}" placeholder="Stücke, Anmeldeschluss"></div>
  <div class="row" style="margin-top:10px"><button class="pri" data-a="evsave">${e?"Speichern":"Termin hinzufügen"}</button>${e?`<button data-a="evcancel">Abbrechen</button><span class="sp"></span><button class="del" data-a="evdel">Löschen</button>`:""}<span class="small" id="everr" style="color:var(--da)"></span></div></div>
  <div class="row small" style="margin-bottom:8px">${Object.keys(EVTYP).map(k=>`<span><span class="dot" style="background:${EVCOL[k]}"></span>${k}</span>`).join(" ")}</div>
  <div class="months">`;
  for (let m = 0; m < 12; m++){
    const y = calYear + (m+7 >= 12 ? 1 : 0), mo = (m+7)%12;
    const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate(), off = (first.getDay()+6)%7;
    let cells = "<tr>" + "<td></td>".repeat(off);
    for (let d = 1; d <= days; d++){
      const ds = iso(new Date(y, mo, d)); const ev = evs.find(x => ds >= x.datum && ds <= (x.bis||x.datum));
      const dow = (off+d-1)%7, endDs = ev ? (ev.bis||ev.datum) : "";
      const se = ev ? ((ds===ev.datum || dow===0 || d===1) ? " s" : "") + ((ds===endDs || dow===6 || d===days) ? " e" : "") : "";
      cells += `<td class="${ev?"ev"+se:""}${ds===today()?" today":""}" ${ev?`style="--evc:${EVCOL[ev.typ]}" title="${esc(ev.titel)}"`:""}>${d}</td>`;
      if ((off+d)%7 === 0) cells += "</tr><tr>";
    }

async function saveFile(filename, data, type){
  const dl = null;
  try { const file = new File([data], filename, {type}); if (navigator.canShare && navigator.canShare({files:[file]}) && matchMedia("(pointer:coarse)").matches){ await navigator.share({files:[file]}); return true; } } catch(e) { if (e && e.name === "AbortError") return false; }
  if (dl){ try { await dl.save({filename, data}); return true; } catch(e) { if (e && e.code === "declined") return false; toast("Die Datei konnte nicht gesichert werden."); return false; } }
  const u = URL.createObjectURL(new Blob([data], {type})), x = document.createElement("a");
  x.href = u; x.download = filename; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return true;
}

    <div class="seg"><button class="${litF.group?"on":""}" data-a="litGrp" data-v="1">Nach Ordnern</button><button class="${litF.group?"":"on"}" data-a="litGrp" data-v="">Liste</button></div>

  if (!books.length) html += `<div class="card empty"><h2>Noch keine Literatur</h2><p class="muted">Tippe auf «PDF hinzufügen» und wähle deine Noten aus.</p></div>`;
  else if (!list.length) html += `<p class="muted">Nichts gefunden.</p>`;
  else html += `<div class="card lit-card"><table class="lit-t"><thead><tr>${th("titel","Titel")}${th("autor","Autor","c-a")}${litF.kat==="Alle"?th("kat","Kategorie","c-k"):""}<th class="c-b">Bereiche</th><th class="c-st">Stufe</th>${th("seiten","Seiten","c-s num")}${th("sus","SuS")}<th></th></tr></thead><tbody>
    ${(() => { const cols = litF.kat === "Alle" ? 8 : 7;
      if (!litF.group) return list.map(row).join("");
      const g = {}; list.forEach(b => (g[b.ordner || "Ohne Ordner"] ||= []).push(b));
      return Object.keys(g).sort((a, b) => a.localeCompare(b, "de")).map(o => `<tr class="lit-g"><th colspan="${cols}">${esc(o)} <span class="tiny num">${g[o].length}</span></th></tr>` + g[o].map(row).join("")).join(""); })()}
    </tbody></table></div>
    <p class="tiny">${list.length} von ${books.length} · Titel antippen öffnet die Noten.</p>`;
  function row(b){
      const us = bookUsers(b.id), meta = [b.autor, (b.stufen||[]).map(s => STK[s]).join("/"), b.seiten + " S."].filter(Boolean).join(" · ");
      if (editBook === b.id) return `<tr><td colspan="8"><div id="bkEdit"><div class="f">
        <div style="grid-column:1/-1"><label for="be-titel">Titel</label><input id="be-titel" value="${esc(b.titel)}"></div>
        <div><label for="be-autor">Autor</label><input id="be-autor" value="${esc(b.autor)}"></div>
        <div><label for="be-ordner">Ordner</label><input id="be-ordner" value="${esc(b.ordner)}"></div>
        <div><label for="be-kat">Kategorie</label><select id="be-kat">${[...new Set([...KATS, b.kat])].map(k => `<option ${b.kat===k?"selected":""}>${esc(k)}</option>`).join("")}</select></div>
        <div><label for="be-off">Heftseite 1 = PDF-Seite</label><input id="be-off" type="number" inputmode="numeric" value="${(b.off||0)+1}"></div></div>
        <label style="margin-top:8px">Stufen</label><div class="row" id="be-stufen">${STUFEN.map(k => `<button class="chip ${(b.stufen||[]).includes(k)?"on":""}" data-a="evs" data-v="${k}">${k}</button>`).join("")}</div>
        <label style="margin-top:8px">Bereiche</label><div class="row" id="be-instr">${INSTR.map(k => `<button class="chip ${(b.instr||[]).includes(k)?"on":""}" data-a="evs" data-v="${k}">${k}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px"><button class="pri" data-a="bkSave" data-v="${b.id}">Speichern</button><button data-a="bkCancel">Abbrechen</button><span class="sp"></span><button class="del" data-a="bkDel" data-v="${b.id}">Aus Katalog entfernen</button></div></div></td></tr>`;
      return `<tr>
        <td class="c-t"><button class="lit-open" data-a="bkOpen" data-v="${b.id}">${esc(b.titel)}</button><div class="tiny m-only">${esc(meta)}</div>
          ${(b.marks||[]).length ? `<div class="lit-marks">${b.marks.slice().sort((x,y) => x.p - y.p).map(m => `<button class="chip" data-a="bkOpen" data-v="${b.id}" data-p="${m.p}">${esc(m.t)} · S. ${m.p - (b.off||0)}</button>`).join("")}</div>` : ""}</td>
        <td class="c-a small muted">${esc(b.autor)}</td>
        ${litF.kat==="Alle" ? `<td class="c-k"><span class="badge ${{Lehrmittel:"b-ac","Stücke":"b-pu","Unterrichtsblätter":"b-te"}[b.kat]||"b-gr"}">${esc(b.kat)}</span></td>` : ""}
        <td class="c-b tiny">${esc((b.instr||[]).join(", "))}</td>
        <td class="c-st"><span class="stk">${(b.stufen||[]).map(s => `<abbr title="${s}">${STK[s]}</abbr>`).join("")}</span>${b.lp ? ` <span class="tiny" title="Steht im Lehrplan AP">LP</span>` : ""}</td>
        <td class="c-s small num muted">${b.seiten}</td>
        <td>${us.map(s => `<a class="badge b-ac" href="#s-${s.id}" style="text-decoration:none">${esc(s.name.split(" ")[0])}</a>`).join(" ")}</td>
        <td style="text-align:right"><button class="ghost small" data-a="bkEdit" data-v="${b.id}" aria-label="${esc(b.titel)} bearbeiten">Bearbeiten</button></td></tr>`;
  }
  app.innerHTML = html;
  const qi = document.getElementById("litQ"); qi.oninput = () => { litF.q = qi.value; const pos = qi.selectionStart; vLiteratur(); const n = document.getElementById("litQ"); n.focus(); n.setSelectionRange(pos, pos); };
  document.getElementById("litI").onchange = e => { litF.instr = e.target.value; vLiteratur(); };
  document.getElementById("litSt").onchange = e => { litF.stufe = e.target.value; vLiteratur(); };
}

/* ---------- Notenviewer (pdf.js, im Hauptthread) ---------- */
let pdfjsP = null;
function loadPdfjs(){
  if (pdfjsP) return pdfjsP;
  const base = "vendor/";
  const add = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  pdfjsP = add(base + "pdf.min.js").then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return window.pdfjsLib; });
  pdfjsP.catch(() => { pdfjsP = null; });
  return pdfjsP;
}
const docCache = new Map();
function getDoc(a){
  if (docCache.has(a)) return docCache.get(a);
  const pr = (async () => {
    const lib = await loadPdfjs();
    const data = await pdfBytes(a);
    return lib.getDocument({data: data.slice(), isEvalSupported: false}).promise;
  })();
  docCache.set(a, pr); pr.catch(() => docCache.delete(a));
  while (docCache.size > 4){ const k = docCache.keys().next().value; const old = docCache.get(k); docCache.delete(k); old.then(d => d.destroy()).catch(() => {}); }
  return pr;
}
function locate(b, p){ let r = p; for (const t of b.teile){ if (r <= t.n) return {t, lp: r}; r -= t.n; } const t = b.teile[b.teile.length-1]; return {t, lp: t.n}; }
const pv = {b:null, p:1, zoom:1, fit:"page", sid:null, lit:null, tok:0, task:null, pop:null};
const $ = id => document.getElementById(id);
function openPdf(bid, p, ctx){
  const b = bookById(bid); if (!b){ toast("Dieses Heft ist nicht mehr im Katalog."); return; }
  if (!b.teile.length || !b.teile.every(t => t.a)){ toast("Das PDF ist noch nicht hochgeladen."); return; }
  Object.assign(pv, {b, p: Math.max(1, Math.min(b.seiten, p || 1)), zoom: 1, sid: ctx?.sid || null, lit: ctx?.lit || null, pop: null});
  $("pv").hidden = false; document.body.style.overflow = "hidden";
  $("pvHere").hidden = !pv.lit; pvMarks(); pvPopRender(); pvShow();
}
function closePdf(){ $("pv").hidden = true; document.body.style.overflow = ""; pv.tok++; if (pv.task) try { pv.task.cancel(); } catch(e) {} render(); }
function pvMarks(){
  const sel = $("pvMarks"), m = (pv.b.marks || []).slice().sort((x,y) => x.p - y.p);
  sel.hidden = !m.length;
  sel.innerHTML = `<option value="">Lesezeichen …</option>` + m.map(x => `<option value="${x.p}">${esc(x.t)} · S. ${x.p - (pv.b.off||0)}</option>`).join("");
}
async function pvShow(){
  const b = pv.b, tok = ++pv.tok, off = b.off || 0;
  $("pvT").textContent = b.titel; $("pvP").value = pv.p - off; $("pvN").textContent = "/ " + (b.seiten - off);
  $("pvFit").textContent = pv.fit === "page" ? "Breite" : "Ganze Seite";
  const msg = $("pvMsg"), c = $("pvC"), body = $("pvBody");
  const slow = setTimeout(() => { if (tok === pv.tok){ msg.textContent = "Noten werden geladen …"; c.hidden = true; } }, 250);
  const {t, lp} = locate(b, pv.p);
  try {
    const doc = await getDoc(t.a); if (tok !== pv.tok) return;
    const page = await doc.getPage(Math.min(lp, doc.numPages)); if (tok !== pv.tok) return;
    const w = body.clientWidth - 16, h = body.clientHeight - 16, v1 = page.getViewport({scale: 1});
    const base = pv.fit === "width" ? w / v1.width : Math.min(w / v1.width, h / v1.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5), vp = page.getViewport({scale: base * pv.zoom * dpr});
    const cv = document.createElement("canvas"); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    if (pv.task) try { pv.task.cancel(); } catch(e) {}
    pv.task = page.render({canvasContext: cv.getContext("2d"), viewport: vp});
    await pv.task.promise; if (tok !== pv.tok) return;
    clearTimeout(slow);
    c.width = cv.width; c.height = cv.height; c.getContext("2d").drawImage(cv, 0, 0);
    c.style.width = (vp.width / dpr) + "px"; c.style.height = (vp.height / dpr) + "px"; c.hidden = false; msg.textContent = "";
    body.scrollTop = 0; body.scrollLeft = Math.max(0, (body.scrollWidth - body.clientWidth) / 2);
    const nx = locate(b, Math.min(pv.p + 1, b.seiten)); if (nx.t !== t) getDoc(nx.t.a).catch(() => {});
  } catch(e) {
    clearTimeout(slow);
    if (tok === pv.tok && !(e && e.name === "RenderingCancelledException")){ c.hidden = true; msg.textContent = e && /PDF/.test(e.message || "") ? e.message : "Das PDF konnte nicht geladen werden. Prüfe die Verbindung und versuche es nochmals."; }
  }
}
function pvGo(p){ if (!pv.b) return; const n = Math.max(1, Math.min(pv.b.seiten, p)); if (n !== pv.p){ pv.p = n; pvShow(); } else $("pvP").value = pv.p - (pv.b.off||0); }
function pvPopRender(){
  const el = $("pvPop"), off = pv.b.off || 0;
  if (!pv.pop){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  if (pv.pop === "assign"){
    const list = sorted();
    el.innerHTML = `<div class="row"><b class="small">Für SuS merken</b>
      <select id="pvS" aria-label="Schüler:in">${list.map(s => `<option value="${s.id}" ${s.id===pv.sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select>
      <input id="pvSt" placeholder="Stück / Übung (optional)" aria-label="Stück">
      <input id="pvSe" type="number" inputmode="numeric" value="${pv.p - off}" style="flex:0 0 80px" aria-label="Seite">
      <button class="pri" data-pv="assignOk">Merken</button><button class="ghost" data-pv="popx">Abbrechen</button></div>`;
  } else {
    const m = (pv.b.marks || []).slice().sort((x,y) => x.p - y.p);
    el.innerHTML = `<div class="row"><b class="small">Lesezeichen auf S. ${pv.p - off}</b>
      <input id="pvMk" placeholder="Name, z. B. Etüde Nr. 12" aria-label="Name des Lesezeichens">
      <button class="pri" data-pv="markOk">Speichern</button><button class="ghost" data-pv="popx">Schliessen</button></div>
      ${m.length ? `<div class="row" style="margin-top:8px;gap:4px">${m.map((x,i) => `<span class="chip" style="cursor:default">${esc(x.t)} · S. ${x.p - off} <button class="ghost del" style="min-height:0;padding:0 0 0 6px" data-pv="markDel" data-i="${pv.b.marks.indexOf(x)}" aria-label="Lesezeichen löschen">×</button></span>`).join("")}</div>` : ""}`;
    setTimeout(() => $("pvMk")?.focus(), 0);
  }
}
$("pv").addEventListener("click", ev => {
  const t = ev.target.closest("[data-pv]"); if (!t) return;
  const off = pv.b.off || 0;
  switch (t.dataset.pv){
    case "close": closePdf(); break;
    case "prev": pvGo(pv.p - 1); break;
    case "next": pvGo(pv.p + 1); break;
    case "fit": pv.fit = pv.fit === "page" ? "width" : "page"; pv.zoom = 1; pvShow(); break;
    case "in": pv.zoom = Math.min(4, pv.zoom * 1.25); pvShow(); break;
    case "out": pv.zoom = Math.max(.5, pv.zoom / 1.25); pvShow(); break;
    case "assign": case "mark": pv.pop = pv.pop === t.dataset.pv ? null : t.dataset.pv; pvPopRender(); break;
    case "popx": pv.pop = null; pvPopRender(); break;
    case "assignOk": {
      const s = S($("pvS").value); if (!s) return;
      const x = {id: uid(), b: pv.b.id, stueck: $("pvSt").value.trim(), seite: +$("pvSe").value || (pv.p - off), status: "aktuell", seit: today()};
      (s.lit ||= []).push(x); save(); pv.pop = null; pvPopRender(); toast(`Bei ${s.name} gespeichert`); break;
    }
    case "markOk": { const name = $("pvMk").value.trim(); if (!name){ $("pvMk").focus(); return; } (pv.b.marks ||= []).push({t: name, p: pv.p}); saveBooks(); pvMarks(); pvPopRender(); toast("Lesezeichen gespeichert"); break; }
    case "markDel": pv.b.marks.splice(+t.dataset.i, 1); saveBooks(); pvMarks(); pvPopRender(); break;
    case "here": { const s = S(pv.sid), x = s && (s.lit || []).find(y => y.id === pv.lit); if (x){ x.seite = pv.p - off; save(); toast(`${s.name}: weiter auf S. ${x.seite}`); } break; }
  }
});
$("pvP").addEventListener("change", e => pvGo((+e.target.value || 1) + (pv.b.off || 0)));
$("pvMarks").addEventListener("change", e => { if (e.target.value) pvGo(+e.target.value); e.target.value = ""; });
document.addEventListener("keydown", e => {
  if ($("pv").hidden) return;
  if (e.key === "Escape"){ if (pv.pop){ pv.pop = null; pvPopRender(); } else closePdf(); return; }
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " "){ e.preventDefault(); pvGo(pv.p + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); pvGo(pv.p - 1); }
});
(() => { let x0 = null, y0 = 0; const body = $("pvBody");
  body.addEventListener("touchstart", e => { if (e.touches.length === 1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, {passive: true});
  body.addEventListener("touchend", e => { if (x0 === null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (body.scrollWidth > body.clientWidth + 2) return;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) pvGo(pv.p + (dx < 0 ? 1 : -1)); }, {passive: true});
})();
window.addEventListener("resize", () => { if (!$("pv").hidden) pvShow(); });

/* ---------- PDFs direkt im Klassenbuch hinzufügen ---------- */
$("pdfIn").onchange = async e => {
  const fs = [...e.target.files]; e.target.value = ""; if (!fs.length) return;
  let ok = 0, mapped = 0; const map = (await idbGet("cfg", "pdfmap")) || {};
  for (const f of fs){
    try {
      toast(`Lädt ${f.name} …`);
      const u8 = new Uint8Array(await f.arrayBuffer());
      const lib = await loadPdfjs(); const doc = await lib.getDocument({data: u8.slice(), isEvalSupported: false}).promise; const n = doc.numPages; doc.destroy();
      if (map[f.name]){ await storePdf(map[f.name], u8, n, f.name); mapped++; continue; }
      const id = uid() + uid();
      await storePdf(id, u8, n, f.name);
      books.push({id: uid(), titel: f.name.replace(/\.pdf$/i, ""), autor: "", kat: "Unterrichtsblätter", ordner: "Neu hinzugefügt", instr: [], seiten: n, off: 0, teile: [{a: id, n}], marks: [], stufen: []});
      ok++;
    } catch(err) { toast(`${f.name} ist kein lesbares PDF.`); }
  }
  if (ok) saveBooks();
  if (ok || mapped){ render(); toast([ok ? ok + " PDF(s) hinzugefügt" : "", mapped ? mapped + " PDF(s) zugeordnet" : ""].filter(Boolean).join(", ")); }
};

startApp();
