<script>
// Darstellung wie im Klassenbuch: kb-theme (dark|light|system), kb-palette (bunt|warm|kuehl), kb-bunt (eigene Farben)
(function(){ try { var r = document.documentElement, th = localStorage.getItem("kb-theme"), p = localStorage.getItem("kb-palette");
  if (th === "dark" || th === "light") r.setAttribute("data-theme", th); if (p === "warm" || p === "kuehl") r.setAttribute("data-palette", p); } catch(e) {} })();
function kbBuntCss(c){var ok=function(x){return /^#[0-9a-fA-F]{6}$/.test(x||"");};if(!c||!["t1","t2","t3","ac"].every(function(k){return ok(c[k]);}))return "";var L=function(x,p){return "color-mix(in srgb, "+x+" "+p+"%, #fff)";},D=function(x,p){return "color-mix(in srgb, "+x+" "+p+"%, #141414)";};var li="--ac:"+c.ac+";--acbg:"+L(c.ac,14)+";--ac-soft:"+L(c.ac,14)+";--t1:"+L(c.t1,22)+";--t2:"+L(c.t2,22)+";--t3:"+L(c.t3,22)+";--t1x:#1b1b1b;--t2x:#1b1b1b;--t3x:#1b1b1b",dk="--ac:"+L(c.ac,55)+";--acbg:"+D(c.ac,35)+";--ac-soft:"+D(c.ac,35)+";--t1:"+D(c.t1,26)+";--t2:"+D(c.t2,26)+";--t3:"+D(c.t3,26)+";--t1x:#f0f0f0;--t2x:#f0f0f0;--t3x:#f0f0f0";return ":root:not([data-palette]){"+li+"}@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]):not([data-palette]){"+dk+"}}:root[data-theme=\"dark\"]:not([data-palette]){"+dk+"}";}
function kbBuntApply(){var c=null;try{c=JSON.parse(localStorage.getItem("kb-bunt")||"null");}catch(e){}var el=document.getElementById("kbBunt");if(!el){el=document.createElement("style");el.id="kbBunt";document.head.appendChild(el);}el.textContent=kbBuntCss(c);}
kbBuntApply();
</script>

<style>
/* Übungsseite für Kinder: kein Login. Der Schlüssel steht nur im Link (#…), der Server sieht nur verschlüsselte Daten. */
:root{--bg:#ffffff;--soft:#f3f6f9;--card:#ffffff;--tx:#13212e;--tx2:#4c5b69;--tx3:#7a8794;--bd:#e3e9ef;--bd2:#cfd8e1;

--ac:#8dbbe8;--ac-ink:#0d2236;--ac-soft:#1a3047;--t1:#1c3828;--t1x:#bfe5cc;--t2:#432f1b;--t2x:#fbd3a8;--t3:#1d2f4d;--t3x:#c4d8fa;--good:#6fae3c;--maybe:#d9a447;color-scheme:dark}
:root:not([data-theme="light"])[data-palette="warm"]{--ac:#f2a27c;--good:#f2f2f2;--ac-ink:#2a1206;--ac-soft:#3a2219;--t1:#3b3210;--t1x:#f6e39a;--t2:#45291a;--t2x:#fbc9a3;--t3:#47201d;--t3x:#f5b8af}
:root:not([data-theme="light"])[data-palette="kuehl"]{--ac:#79c6cf;--maybe:#7f8ef0;--ac-ink:#062628;--ac-soft:#12343a;--t1:#163a32;--t1x:#a9e3d3;--t2:#133847;--t2x:#a9dbea;--t3:#1c2c52;--t3x:#c0d0fa}}

--ac:#8dbbe8;--ac-ink:#0d2236;--ac-soft:#1a3047;--t1:#1c3828;--t1x:#bfe5cc;--t2:#432f1b;--t2x:#fbd3a8;--t3:#1d2f4d;--t3x:#c4d8fa;--good:#6fae3c;--maybe:#d9a447;color-scheme:dark}

*{box-sizing:border-box}

.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:700;background:var(--ac);color:var(--ac-ink);border:0;border-radius:999px;padding:14px 28px;min-height:56px}

</style></head><body><main class="wrap" id="p"><p class="sub">Lädt …</p></main>
<script>
const API = "https://api.klassen-buch.ch/kb/";   // setzt build.py
const p = document.getElementById("p"), te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const un64 = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); s += "===".slice((s.length + 3) % 4); const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
const dat = s => { const [y, m, d] = String(s).split("-").map(Number); return `${d}.${m}.${y}`; };
const mmss = n => { n = Math.max(0, Math.ceil(n)); return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} } };
async function dec(keyRaw, u8){ const key = await crypto.subtle.importKey("raw", keyRaw, "AES-GCM", false, ["decrypt"]); return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: u8.subarray(0, 12)}, key, u8.subarray(12))); }
function msg(h, t){ p.innerHTML = `<h1>${esc(h)}</h1><p class="sub">${esc(t)}</p>`; }

let doc = null, tok = "";
async function load(){
  const k = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{22}$/.test(k)){ msg("Link unvollständig", "Dieser Link ist nicht ganz. Öffne ihn nochmals so, wie du ihn bekommen hast."); return; }
  tok = hex(await crypto.subtle.digest("SHA-256", te.encode("klassenbuch-uebe-v1:" + k))).slice(0, 32);
  let data = null, gone = false;
  try {
    const r = await fetch(API + "uget", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({t: tok})});
    if (r.status === 404) gone = true; else if (r.ok){ data = (await r.json()).data; store.set("kb-ub:" + tok, data); }
  } catch(e) {}
  if (gone){ msg("Diese Seite gibt es nicht mehr", "Frag deine Lehrperson nach dem neuen Link."); return; }
  if (!data) data = store.get("kb-ub:" + tok);
  if (!data){ msg("Keine Verbindung", "Die Seite lässt sich gerade nicht laden. Prüfe das Internet und versuche es nochmals."); return; }
  try {
    const b = atob(data), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    doc = JSON.parse(td.decode(await dec(un64(k), u)));
  } catch(e) { msg("Link passt nicht", "Diese Seite lässt sich mit dem Link nicht öffnen. Frag deine Lehrperson nach dem neuen Link."); return; }
  view();
}

/* --- Ansicht --- */
function view(){
  const L = doc.l || [], cur = L[0];
  document.title = "Üben – " + doc.n;
  if (!cur){ p.innerHTML = `${lookBtn()}<h1>Hallo ${esc(doc.n)}! 👋</h1><p class="sub">Hier erscheinen bald deine Aufnahmen und dein Übungsplan.</p>${freeHtml()}${metHtml()}`; return; }
  const older = L.slice(1).filter(x => x.r.length);
  p.innerHTML = `${lookBtn()}<h1>Hallo ${esc(doc.n)}! 👋</h1><p class="sub">Deine Übung aus der Lektion vom ${dat(cur.d)}</p>
    ${cur.p.length ? `<section class="card c1" id="plan" aria-label="Übungsplan"></section>` : ""}
    ${freeHtml()}
    ${cur.r.length ? `<section class="card c3"><h2>🎧 Zum Mitspielen</h2>${cur.r.map(recHtml).join("")}</section>` : ""}
    ${metHtml()}
    ${cur.a.trim() ? `<section class="card c2"><h2>📝 Deine Aufgaben</h2><p class="hw">${esc(cur.a)}</p></section>` : ""}
    ${older.length ? `<details class="card c0"><summary>Ältere Aufnahmen</summary>${older.map(x => `<h2 style="margin-top:14px">${dat(x.d)}</h2>${x.r.map(recHtml).join("")}`).join("")}</details>` : ""}
    <p class="foot">Lade diese Seite als Lesezeichen oder auf den Home-Bildschirm, dann findest du sie schnell wieder.</p>`;
  if (cur.p.length) planView();
}

/* --- Darstellung (wie im Klassenbuch, pro Gerät) --- */
const BUNT_DEF = {t1: "#5fb37c", t2: "#f2a35e", t3: "#6f9be8", ac: "#1d5a8f"};
let lookOpen = false;
const pref = (k, d) => store.get(k) || d;
function buntCfg(){ let c = {}; try { c = JSON.parse(store.get("kb-bunt") || "{}") || {}; } catch(e) {} return Object.assign({}, BUNT_DEF, c); }
function lookBtn(){
  const th = pref("kb-theme", "system"), pa = pref("kb-palette", "bunt"), own = pa === "bunt" && !!store.get("kb-bunt"), cur = own ? "eigen" : pa;
  const b = (a, v, l, on) => `<button class="pill" data-a="${a}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
  return `<div class="top"><button class="pill" data-a="look" aria-expanded="${lookOpen}" aria-label="Farben und Darstellung">🎨 Farben</button></div>
  ${lookOpen ? `<section class="card c0 look" aria-label="Darstellung">
    <div class="row"><b>Modus</b>${[["light", "☀️ Hell"], ["dark", "🌙 Dunkel"], ["system", "Wie Gerät"]].map(([v, l]) => b("th", v, l, th === v)).join("")}</div>
    <div class="row"><b>Farben</b>${[["bunt", "Bunt"], ["warm", "Warm"], ["kuehl", "Kühl"], ["eigen", "Eigene"]].map(([v, l]) => b("pa", v, l, cur === v)).join("")}</div>
    ${cur === "eigen" ? `<div class="cols">${[["t1", "Fläche 1"], ["t2", "Fläche 2"], ["t3", "Fläche 3"], ["ac", "Knöpfe"]].map(([k, l]) => `<label><input type="color" data-bunt="${k}" value="${buntCfg()[k]}">${l}</label>`).join("")}</div>` : ""}
    <div class="row"><button class="pill" data-a="look">Fertig</button></div></section>` : ""}`;
}
function setLook(a, v){
  const r = document.documentElement;
  if (a === "th"){ store.set("kb-theme", v); if (v === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", v); }
  else {
    const pa = v === "eigen" ? "bunt" : v; store.set("kb-palette", pa);
    if (pa === "bunt") r.removeAttribute("data-palette"); else r.setAttribute("data-palette", pa);
    if (v === "eigen"){ if (!store.get("kb-bunt")) store.set("kb-bunt", JSON.stringify(BUNT_DEF)); } else if (v === "bunt") { try { localStorage.removeItem("kb-bunt"); } catch(e) {} }
    kbBuntApply();
  }
  lookPaint();
}
function lookPaint(){ const top = p.querySelector(".top"); if (!top) return; const nx = top.nextElementSibling; if (nx && nx.classList.contains("look")) nx.remove(); top.outerHTML = lookBtn(); }
p.addEventListener("input", ev => { const i = ev.target; if (!i.dataset || !i.dataset.bunt) return; const c = buntCfg(); c[i.dataset.bunt] = i.value; store.set("kb-bunt", JSON.stringify(c)); kbBuntApply(); });

/* --- Aufnahmen --- */
const recs = {};
const RATES = [[1, "Normal", "Normales Tempo"], [0.95, "🐢", "Etwas langsamer, 95 Prozent"], [0.85, "🐢🐢", "Langsamer, 85 Prozent"], [0.75, "🐢🐢🐢", "Viel langsamer, 75 Prozent"]];
function recHtml(x){
  recs[x.id] = x;
  return `<div class="rec" data-r="${esc(x.id)}"><button class="play" data-a="play" aria-label="${esc(x.t)} abspielen">▶</button><b>${esc(x.t)}</b>
    <input type="range" min="0" max="${x.dur || 1}" step="0.1" value="0" data-a="seek" aria-label="Stelle in der Aufnahme">
    <div class="ctl"><span class="t" data-t>0:00 / ${mmss(x.dur || 0)}</span>
      <button class="pill" data-a="loop" aria-pressed="false">🔁 Wiederholen</button>
      <span class="seg" role="group" aria-label="Tempo">${RATES.map(([v, l, n]) => `<button class="pill" data-a="rate" data-v="${v}" aria-pressed="${v === 1}" aria-label="${n}">${l}</button>`).join("")}</span></div></div>`;
}
const players = {};
async function player(x){
  if (players[x.id]) return players[x.id];
  const parts = [];
  for (const f of x.f){ const r = await fetch(API + "f/" + f); if (!r.ok) throw new Error("http"); parts.push(new Uint8Array(await r.arrayBuffer())); }
  const all = new Uint8Array(parts.reduce((a, q) => a + q.length, 0)); let o = 0; parts.forEach(q => { all.set(q, o); o += q.length; });
  const a = new Audio(URL.createObjectURL(new Blob([await dec(un64(x.k), all)], {type: x.mime || "audio/mp4"})));
  a.preservesPitch = true; a.webkitPreservesPitch = true;
  a.ontimeupdate = () => upd(x.id); a.onended = () => upd(x.id); a.onpause = () => upd(x.id); a.onplay = () => upd(x.id);
  a.onloadedmetadata = () => { const el = row(x.id); if (el && isFinite(a.duration)) el.querySelector("[data-a=seek]").max = a.duration; };
  return players[x.id] = a;
}
const row = id => document.querySelector(`[data-r="${CSS.escape(id)}"]`);
function upd(id){
  const a = players[id], el = row(id); if (!a || !el) return;
  const d = isFinite(a.duration) ? a.duration : (recs[id].dur || 0);
  el.querySelector(".play").textContent = a.paused ? "▶" : "❚❚";
  el.querySelector(".play").setAttribute("aria-label", (a.paused ? "Abspielen: " : "Anhalten: ") + recs[id].t);
  el.querySelector("[data-t]").textContent = mmss(Math.floor(a.currentTime)) + " / " + mmss(d);
  const s = el.querySelector("[data-a=seek]"); if (document.activeElement !== s) s.value = a.currentTime;
}
p.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const r = b.closest("[data-r]"), x = r && recs[r.dataset.r];
  if (x){
    if (b.dataset.a === "play"){
      const was = b.textContent; b.textContent = "…";
      try { const a = await player(x); if (a.paused){ Object.values(players).forEach(o => o !== a && o.pause()); await a.play(); } else a.pause(); }
      catch(e) { b.textContent = was; alert("Die Aufnahme lässt sich gerade nicht laden. Prüfe das Internet."); }
      return;
    }
    if (b.dataset.a === "loop"){
      const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
      const a = await player(x).catch(() => null); if (a) a.loop = on;
      return;
    }
    if (b.dataset.a === "rate"){
      r.querySelectorAll("[data-a=rate]").forEach(y => y.setAttribute("aria-pressed", y === b));
      const a = await player(x).catch(() => null); if (a) a.playbackRate = +b.dataset.v;
      return;
    }
  }
  if (b.dataset.a === "look"){ lookOpen = !lookOpen; lookPaint(); return; }
  if (b.dataset.a === "th" || b.dataset.a === "pa"){ setLook(b.dataset.a, b.dataset.v); return; }
  if (b.dataset.a in T_free){ T_free[b.dataset.a](); return; }
  if (b.dataset.a in T) T[b.dataset.a]();
});
p.addEventListener("input", ev => { const s = ev.target; if (s.dataset.a !== "seek") return; const r = s.closest("[data-r]"), a = r && players[r.dataset.r]; if (a) a.currentTime = +s.value; });

/* --- Übungsplan mit Timer --- */
let run = null, tick = null, lock = null, ac = null;
function plan(){ return doc.l[0].p; }
function planView(){
  const el = document.getElementById("plan"), P = plan(), tot = P.reduce((a, x) => a + x.m, 0);
  if (!run){
    el.innerHTML = `<h2>⏱ Dein Übungsplan · ${tot} Min.</h2><ol class="steps">${P.map(x => `<li><span class="m">${x.m} Min.</span><span>${esc(x.t || "Üben")}</span></li>`).join("")}</ol>
      <div class="acts"><button class="big" data-a="start">▶ Los geht's</button></div>${weekStars()}`;
    return;
  }
  if (run.done){
    el.innerHTML = `<div class="done-c"><div class="star" aria-hidden="true">⭐</div><h2 style="font-size:26px;margin:8px 0 4px">Geschafft!</h2><p style="margin:0 0 14px">Super geübt, ${esc(doc.n)}.</p>${weekStars()}
      <div class="acts" style="margin-top:14px"><button class="pill" data-a="reset">Nochmals von vorne</button></div></div>`;
    return;
  }
  const x = P[run.i];
  el.innerHTML = `<div class="timer" role="timer"><p class="lbl">Teil ${run.i + 1} von ${P.length}</p><p class="task">${esc(x.t || "Üben")}</p>
    <div class="clock" id="clk" aria-live="off">${mmss(left())}</div><div class="bar"><i id="bar" style="width:0%"></i></div>
    <div class="acts"><button class="big" data-a="pause">${run.paused ? "▶ Weiter" : "❚❚ Pause"}</button><button class="pill" data-a="skip">Nächster Teil ⏭</button><button class="pill" data-a="stop">Beenden</button></div></div>
    <ol class="steps" style="margin:16px 0 0">${P.map((y, i) => `<li class="${i < run.i ? "done" : i === run.i ? "now" : ""}"><span class="m">${y.m} Min.</span><span>${esc(y.t || "Üben")}</span></li>`).join("")}</ol>`;
  paint();
}
const left = () => run.paused ? run.rest : (run.end - Date.now()) / 1000;
function paint(){
  const c = document.getElementById("clk"), b = document.getElementById("bar"); if (!c || !run || run.done) return;
  const l = left(), m = plan()[run.i].m * 60; c.textContent = mmss(l); b.style.width = Math.min(100, (1 - l / m) * 100) + "%";
  if (!run.paused && l <= 0) next(true);
}
function begin(i, from){ run = {i, end: (from || Date.now()) + plan()[i].m * 60000, paused: false, rest: 0}; planView(); }
// Geübte Zeit pro Tag (Sekunden) auf diesem Gerät: kb-ub-sec:<t> = {JJJJ-MM-TT: s}
const dayKey = d => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function secs(){ try { return JSON.parse(store.get("kb-ub-sec:" + tok) || "{}") || {}; } catch(e) { return {}; } }
function credit(){
  if (!run || run.done) return;
  const m = plan()[run.i].m * 60, s = Math.round(Math.min(m, Math.max(0, m - left()))); if (!s) return;
  addSecs(s);
}
function addSecs(s){
  if (!(s > 0)) return;
  const o = secs(), d = dayKey(); o[d] = (o[d] || 0) + s;
  const keep = Object.keys(o).sort().slice(-60), x = {}; keep.forEach(k => x[k] = o[k]); store.set("kb-ub-sec:" + tok, JSON.stringify(x));
}
function weekMin(){
  const now = new Date(), from = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7)), S = secs();
  return {wk: Math.round(Object.keys(S).filter(d => d >= from).reduce((a, d) => a + S[d], 0) / 60), td: Math.round((S[dayKey()] || 0) / 60)};
}

/* --- Freies Spielen: Stoppuhr, die hochzählt. Die Zeit zählt zu den geübten Minuten. --- */
const free = {on: false, t0: 0, sess: 0, iv: null};
const freeNow = () => free.sess + (free.on ? (Date.now() - free.t0) / 1000 : 0);
function freeHtml(){
  const m = weekMin();
  return `<section class="card c3" id="free" aria-label="Freies Spielen"><h2>🎵 Freies Spielen</h2>
    <p style="margin:0 0 6px;font-size:15px">Spiel, was du magst. Die Uhr zählt mit.</p>
    <div class="timer"><div class="clock" id="fclk">${mmss(Math.floor(freeNow()))}</div>
    <div class="acts"><button class="big" data-a="fgo" id="fgo">${free.on ? "❚❚ Pause" : freeNow() >= 1 ? "▶ Weiter" : "▶ Start"}</button>${freeNow() >= 1 ? `<button class="pill" data-a="fend">Fertig</button>` : ""}</div></div>
    <p class="mins" style="text-align:center"><b>${m.wk} Min.</b> geübt diese Woche${m.td && m.td !== m.wk ? ` · heute ${m.td} Min.` : ""}</p></section>`;
}
function freeBank(){ if (!free.on) return; const s = (Date.now() - free.t0) / 1000; addSecs(Math.round(s)); free.sess += s; free.t0 = Date.now(); }
function freePaint(){ const el = document.getElementById("free"); if (el) el.outerHTML = freeHtml(); if (!run && document.getElementById("plan")) planView(); }
const T_free = {
  fgo(){ if (free.on){ freeBank(); free.on = false; clearInterval(free.iv); unlock(); } else { free.on = true; free.t0 = Date.now(); keepAwake(); free.iv = setInterval(() => { const c = document.getElementById("fclk"); if (c) c.textContent = mmss(Math.floor(freeNow())); }, 500); } freePaint(); },
  fend(){ freeBank(); free.on = false; clearInterval(free.iv); unlock(); free.sess = 0; freePaint(); },
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") freeBank(); });
window.addEventListener("pagehide", freeBank);
function next(sound){
  credit();
  if (sound) gong(run.i + 1 >= plan().length);
  if (run.i + 1 >= plan().length){ finish(); return; }
  begin(run.i + 1, sound ? run.end : 0);   // nach Ablauf ohne Lücke weiter, auch wenn die Seite im Hintergrund war
}
function finish(){
  run = {done: true}; clearInterval(tick); tick = null; unlock();
  const k = "kb-ub-days:" + tok, days = JSON.parse(store.get(k) || "[]"), d = dayKey();
  if (!days.includes(d)){ days.push(d); store.set(k, JSON.stringify(days.slice(-60))); }
  planView();
}
function weekStars(){
  const days = JSON.parse(store.get("kb-ub-days:" + tok) || "[]"), now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay() + 6) % 7);
  const n = days.filter(d => new Date(d + "T12:00") >= mon).length, {wk, td} = weekMin();
  const mins = `<p class="mins"><b>${wk} Min.</b> geübt diese Woche${td && td !== wk ? ` · heute ${td} Min.` : ""}</p>`;   // immer sichtbar, auch 0
  return (n ? `<p class="week" aria-label="Diese Woche ${n}-mal geübt">${"⭐".repeat(n)}</p><p style="margin:0;font-size:15px">Diese Woche schon ${n}-mal geübt</p>` : "") + mins;
}
/* --- Metronom (Web Audio, genau getaktet) --- */
const met = {on: false, bpm: Math.min(240, Math.max(30, +store.get("kb-ub-bpm") || 80)), next: 0, t: null};
function metHtml(){
  return `<section class="card c0" id="met" aria-label="Metronom"><h2>🥁 Metronom</h2>
    <div class="met"><button class="pill" data-a="m5" aria-label="5 langsamer">−5</button><button class="pill" data-a="m1" aria-label="1 langsamer">−1</button>
    <div class="bpm"><b id="bpm">${met.bpm}</b><span>pro Minute</span></div>
    <button class="pill" data-a="p1" aria-label="1 schneller">+1</button><button class="pill" data-a="p5" aria-label="5 schneller">+5</button></div>
    <div class="acts"><span class="mdot" id="mdot" aria-hidden="true"></span><button class="big" data-a="mgo" id="mgo">${met.on ? "■ Stopp" : "▶ Start"}</button></div></section>`;
}
function metSet(d){ met.bpm = Math.min(240, Math.max(30, met.bpm + d)); store.set("kb-ub-bpm", met.bpm); document.getElementById("bpm").textContent = met.bpm; }
function metTick(){
  while (met.next < ac.currentTime + 0.12){
    const t = met.next, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 1500; g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.06);
    const ms = Math.max(0, (t - ac.currentTime) * 1000); setTimeout(() => { const d = document.getElementById("mdot"); if (d){ d.classList.add("on"); setTimeout(() => d.classList.remove("on"), 90); } }, ms);
    met.next += 60 / met.bpm;
  }
}
function metGo(){
  audio(); met.on = !met.on;
  if (met.on){ met.next = ac.currentTime + 0.05; metTick(); met.t = setInterval(metTick, 25); keepAwake(); }
  else { clearInterval(met.t); if (!run || run.done) unlock(); }
  document.getElementById("mgo").textContent = met.on ? "■ Stopp" : "▶ Start";
}
const T = {
  m5(){ metSet(-5); }, m1(){ metSet(-1); }, p1(){ metSet(1); }, p5(){ metSet(5); }, mgo(){ metGo(); },
  start(){ audio(); keepAwake(); begin(0); tick = setInterval(paint, 250); },
  pause(){ if (run.paused){ run.end = Date.now() + run.rest * 1000; run.paused = false; keepAwake(); } else { run.rest = left(); run.paused = true; } planView(); },
  skip(){ next(false); },
  stop(){ if (confirm("Übung beenden?")){ credit(); run = null; clearInterval(tick); tick = null; unlock(); planView(); } },
  reset(){ run = null; planView(); },
};
// Gong beim Wechsel (Web Audio, kein Ton-File nötig)
function audio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch(e) {} }
function gong(end){
  if (!ac) return; const t0 = ac.currentTime;
  (end ? [523.25, 659.25, 783.99] : [880]).forEach((f, i) => [1, 2.01, 3.2].forEach((h, j) => {
    const o = ac.createOscillator(), g = ac.createGain(), t = t0 + i * 0.18;
    o.frequency.value = f * h; o.type = "sine"; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.35 / (j + 1), t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 2.3); }));
  if (navigator.vibrate) navigator.vibrate(end ? [200, 100, 200] : 200);
}
async function keepAwake(){ try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.onrelease = () => lock = null; } } catch(e) {} }
function unlock(){ if (met.on || free.on || (run && !run.done)) return; try { if (lock) lock.release(); } catch(e) {} lock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && run && !run.done && !run.paused){ keepAwake(); paint(); } });
window.addEventListener("hashchange", () => location.reload());
load();
</script></body></html>
